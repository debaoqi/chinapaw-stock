function readReceiptView(id){const m=DB.get('msg',id),c=m&&chGet(m.ch);if(!c)return;const members=(c.mem||DB.all('users').filter(u=>u.active!==false).map(u=>u.id)).filter(x=>x!==m.by);openSheet(`<div class="sh">${L('阅读情况','Read receipts')}</div>${members.map(u=>{const r=DB.all('read').find(x=>x.ch===c.id&&x.userId===u&&x.lastT>=m.t);return `<div class="li"><span style="flex:1">${esc(userName(u))}</span><span>${r?L('已读','Read')+' · '+fdate(r.readAt):L('未读','Unread')}</span></div>`}).join('')}`)}

const leaveReviewer=l=>(DB.get('users',l.by)||{}).role==='ops'?'gm':l.days<=2?'ops':'gm';
const leaveCan=l=>l.status==='submitted'&&l.by!==meId()&&(S.me.role==='chair'||S.me.role===leaveReviewer(l));
function leaveForm(){openSheet(`<div class="sh">${L('请假申请','Leave request')}</div><div class="note-g">${L('0.5–2天由运营经理审批；超过2天由总经理审批。按半天为单位。','0.5–2 days: operations; over 2 days: GM. Half-day increments.')}</div><div class="fld"><label>${L('开始日期','Start')}</label><input class="inp" type="date" id="lvStart" value="${dayKey(Date.now())}"></div><div class="fld"><label>${L('结束日期','End')}</label><input class="inp" type="date" id="lvEnd" value="${dayKey(Date.now())}"></div><div class="fld"><label>${L('天数','Days')}</label><input class="inp" type="number" min="0.5" step="0.5" id="lvDays" value="0.5"></div><div class="fld"><label>${L('半天时段','Half-day session')}</label><select class="inp" id="lvSession"><option value="am">${L('上午','Morning')}</option><option value="pm">${L('下午','Afternoon')}</option></select></div><div class="fld"><label>${L('原因','Reason')}</label><textarea class="inp" id="lvReason"></textarea></div><button class="bigbtn" onclick="leaveSave()">${L('提交申请','Submit')}</button>`)}
async function leaveSave(){const days=+$('#lvDays').value,startDate=$('#lvStart').value,endDate=$('#lvEnd').value,reason=$('#lvReason').value.trim(),session=$('#lvSession').value;const span=(new Date(endDate)-new Date(startDate))/864e5+1;if(!startDate||!endDate||!Number.isFinite(days)||days<.5||days*2!==Math.trunc(days*2)||Math.ceil(days)!==span||reason.length<2)return toast(L('日期范围必须与请假天数一致；半天请选择时段，并填写原因','Date range must match the number of days; choose a session for half days and enter a reason'));if(S.savingLeave)return;S.savingLeave=true;try{const d=DB.put('leave',{days,startDate,endDate,session,reason,status:'submitted',t:Date.now()});await commitBusiness([d.id]);closeSheet(true);go('leave');toast(L('已同步，审批人将在待办中收到申请','Synced; the reviewer will receive the request'),false)}catch(e){toast(L('请假未同步，请检查网络后重试：','Leave not synced; retry after checking the network: ')+String(e.message||e))}finally{S.savingLeave=false}}
V.leave=()=>hdr(L('请假','Leave'),`<button class="pill" onclick="leaveForm()">+ ${L('申请','Request')}</button>`)+`<div class="pad">${DB.all('leave').filter(l=>l.by===meId()||['chair','gm','ops'].includes(S.me.role)).sort((a,b)=>b.t-a.t).map(l=>`<div class="box"><b>${esc(userName(l.by))} · ${l.days} ${L('天','days')}</b><div>${esc(l.startDate)} — ${esc(l.endDate)}</div><div>${esc(l.reason)}</div><div class="xs muted">${l._q?L('待同步','Not synced'):L(({submitted:'待审批',approved:'已批准',rejected:'已拒绝'})[l.status]||l.status,l.status)} · ${l.days<=2?L('运营经理审批','Operations review'):L('总经理审批','GM review')} ${l.approval?' · '+esc(userName(l.approval.by)):''}</div>${l.reject?`<div class="red">${esc(l.reject)}</div>`:''}${leaveCan(l)?`<div class="row gap"><button class="bigbtn" onclick="leaveApprove('${l.id}',true)">${L('通过','Approve')}</button><button class="bigbtn ghost" onclick="leaveApprove('${l.id}',false)">${L('拒绝','Reject')}</button></div>`:''}</div>`).join('')||emptyBox('clock',L('暂无请假记录','No leave requests'))}</div>`;
function leaveApprove(id,ok){const l=DB.get('leave',id);if(!l||!leaveCan(l))return;openSheet(`<div class="sh">${ok?L('批准请假','Approve leave'):L('拒绝请假','Reject leave')}</div><input class="inp" id="lvComment" placeholder="${L('意见；拒绝必填','Comment; required for rejection')}"><button class="bigbtn" onclick="leaveConfirm('${id}',${ok})">${L('确认','Confirm')}</button>`)}
async function leaveConfirm(id,ok){const l=DB.get('leave',id),note=$('#lvComment').value.trim();if(!l||!leaveCan(l)||(!ok&&note.length<2))return toast(L('请填写原因','Enter a reason'));if(S.reviewingLeave)return;S.reviewingLeave=true;try{DB.put('leave',{...l,status:ok?'approved':'rejected',approval:{by:meId(),t:Date.now(),note},reject:ok?'':note});await commitBusiness([id]);closeSheet(true);render(false);toast(ok?L('批准已同步到考勤','Approval synced to attendance'):L('拒绝结果已同步','Rejection synced'),false)}catch(e){toast(L('审批未同步：','Review not synced: ')+String(e.message||e))}finally{S.reviewingLeave=false}}
function leaveSlots(user,date){let am=false,pm=false;for(const l of DB.all('leave').filter(l=>l.by===user&&l.status==='approved'&&!l._q)){const offset=(Date.parse(date+'T12:00:00Z')-Date.parse(l.startDate+'T12:00:00Z'))/864e5;if(offset<0||date>l.endDate)continue;const remaining=+l.days-offset;if(remaining>=1){am=true;pm=true}else if(remaining>=.5){if(l.session==='pm')pm=true;else am=true}}return {am,pm,days:(+am + +pm)/2}}
function leaveMonthDays(user,month){const [y,m]=month.split('-').map(Number),last=new Date(y,m,0).getDate();let n=0;for(let i=1;i<=last;i++)n+=leaveSlots(user,month+'-'+pad2(i)).days;return n}
function leaveAttendanceHTML(user,month){const records=DB.all('leave').filter(l=>l.by===user&&l.status==='approved'&&!l._q&&l.startDate<=month+'-31'&&l.endDate>=month+'-01');return records.length?`<div class="sec-h">${L('已批准请假（计入考勤）','Approved leave (attendance)')}</div><div class="box">${records.map(l=>`<div class="li"><div><b>${esc(userName(l.by))} · ${l.days} ${L('天','days')}</b><div>${esc(l.startDate)} — ${esc(l.endDate)} ${l.days%1?L(l.session==='pm'?'下午':'上午',l.session==='pm'?'PM':'AM'):''}</div><div class="xs muted">${esc(l.reason)} · ${L('审批人','Reviewer')}: ${esc(userName(l.approval?.by))}</div></div></div>`).join('')}</div>`:''}


function deliveryForm(id){const so=DB.get('so',id);if(!so||!['shipped','done'].includes(so.status))return toast(L('出库后才能签收','Ship before confirming receipt'));S.delivery={so:id,customerName:ptName(so.cus),photo:'',signature:'',t:Date.now()};deliverySheet()}
function deliverySheet(){const d=S.delivery;if(!d)return;openSheet(`<div class="sh">${L('客户签收确认','Customer delivery confirmation')}</div><div class="note-g">${L('现场拍照与客户手写签名都必须提交。','Both a site photo and handwritten customer signature are required.')}</div><label>${L('签收人','Recipient')}</label><input class="inp" value="${esc(d.customerName)}" oninput="S.delivery.customerName=this.value"><button class="bigbtn ghost" onclick="deliveryPhoto()">${L('拍摄签收现场','Take delivery photo')}</button>${d.photo?`<img src="${esc(d.photo)}" style="width:100%;max-height:170px;object-fit:contain">`:''}<label>${L('客户手写签名','Customer signature')}</label><canvas id="deliverySign" style="width:100%;height:160px;background:white;border:1px solid #aaa;touch-action:none"></canvas><div class="row gap"><button class="pill" onclick="S.delivery.signature='';S.delivery.signed=false;deliverySheet()">${L('重签','Clear')}</button><button class="bigbtn" onclick="deliverySave()">${L('提交签收','Submit receipt')}</button></div><div class="xs muted">${L('请客户本人核对货物并签字，员工不可代签。','The recipient must inspect and sign personally.')}</div>`);requestAnimationFrame(deliveryCanvas)}
function deliveryCanvas(){const c=$('#deliverySign');if(!c||!S.delivery)return;const ratio=devicePixelRatio||1;c.width=Math.round(c.clientWidth*ratio);c.height=Math.round(160*ratio);const ctx=c.getContext('2d');ctx.scale(ratio,ratio);ctx.lineWidth=2;ctx.lineCap='round';let draw=false;if(S.delivery.signature){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,160);im.src=S.delivery.signature}const p=e=>{const r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};c.onpointerdown=e=>{draw=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...p(e))};c.onpointermove=e=>{if(draw){ctx.lineTo(...p(e));ctx.stroke();S.delivery.signed=true}};c.onpointerup=c.onpointercancel=()=>{draw=false;if(S.delivery)S.delivery.signature=c.toDataURL('image/png')}}
function deliveryPhoto(){const d=S.delivery;camShot(async f=>{try{d.photo=await upImg(await wmImg(f,960,[d.customerName,new Date().toLocaleString(),(DB.get('so',d.so)||{}).no||'']));deliverySheet()}catch(e){toast(String(e.message||e));deliverySheet()}},deliverySheet)}
async function deliverySave(){const d=S.delivery;if(!d?.photo||!d.signature||!d.signed||!d.customerName.trim())return toast(L('请完成拍照、签字和姓名','Photo, signature and recipient name required'));if(S.savingDelivery)return;S.savingDelivery=true;try{const rid='receipt_'+d.so,existing=DB.get('receipt',rid);if(!existing)DB.put('receipt',{...d,id:rid,by:meId()});await commitBusiness([rid]);closeSheet(true);S.delivery=null;await completeSale(d.so)}catch(e){toast(L('签收未同步，照片和签名已保留，请重试：','Receipt not synced; photo and signature retained. Retry: ')+syncErrorText(String(e.message||e)))}finally{S.savingDelivery=false}}
async function completeSale(id){let d=DB.get('so',id);if(!d)return;const receipt=DB.all('receipt').find(r=>r.so===id);if(!receipt?.photo||!receipt.signature){toast(L('请先拍照并由客户签字，保存后才能完成','Take a photo and obtain the customer signature before completion'));deliveryForm(id);return}if(S.completingSale)return;S.completingSale=true;try{await commitBusiness([receipt.id]);d=DB.get('so',id);if(d.status==='done'&&!d._q)return;if(d.status!=='shipped')throw new Error(L('销售单必须先实际出库','The order must be shipped first'));DB.put('so',{...d,status:'done'});await commitBusiness([id]);toast(L('客户签收已保存，销售单已完成并同步','Customer receipt saved; order completed and synced'),false);render(false)}catch(e){toast(L('完成操作未保存，请核对服务器状态：','Completion not saved; check server status: ')+syncErrorText(String(e.message||e)))}finally{S.completingSale=false}}
function syncErrorText(t){return /Photo and customer signature required before completion/.test(t)?L('尚未保存客户签收照片和签名，请先完成签收','Customer photo and signature have not been saved; confirm receipt first'):t}


function stockRequestForm(type='opening'){S.stockRequest={type,wh:myWh(),status:'pending',items:[],t:Date.now()};openSheet(`<div class="sh">${L('期初库存申请','Opening inventory request')}</div><div class="note-y">${L('提交后需运营经理审批，库管确认后才增加库存。','Operations approval and warehouse posting are required.')}</div><label>${L('仓库','Warehouse')}</label>${whSel(myWh(),"S.stockRequest.wh=this.value")}<select class="inp" id="opProduct">${DB.all('products').map(p=>`<option value="${p.id}">${esc(nm(p.n))}</option>`).join('')}</select><input class="inp" type="number" id="opQty" min="0" placeholder="${L('数量','Quantity')}"><input class="inp" type="number" id="opCost" min="0" placeholder="${L('单位成本 GHS','Unit cost GHS')}"><input class="inp" id="opBatch" placeholder="${L('批次','Batch')}"><button class="bigbtn" onclick="stockRequestSave()">${L('提交审批','Submit')}</button>`)}
function stockRequestSave(){const qty=+$('#opQty').value,uc=+$('#opCost').value,pid=$('#opProduct').value;if(!pid||!(qty>0)||!(uc>=0))return toast(L('请检查数量与成本','Check quantity and cost'));DB.put('stockreq',{...S.stockRequest,items:[{pid,qty,uc,batch:$('#opBatch').value.trim()}]});closeSheet(true);go('stock_requests')}
V.stock_requests=()=>hdr(L('期初库存审批','Opening inventory'),`<button class="pill" onclick="stockRequestForm()">+ ${L('申请','Request')}</button>`)+`<div class="pad">${DB.all('stockreq').sort((a,b)=>b.t-a.t).map(d=>`<div class="box"><b>${esc(whName(d.wh))} · ${esc(d.status)}</b><div>${esc(userName(d.by))}</div>${d.items.map(i=>`<div>${esc(pName(i.pid))}: ${i.qty} × ${money(i.uc)}</div>`).join('')}${d.status==='pending'&&['chair','ops'].includes(S.me.role)&&d.by!==meId()?`<button class="bigbtn" onclick="stockRequestApprove('${d.id}')">${L('批准','Approve')}</button>`:''}${d.status==='approved'&&can('po_recv')?`<button class="bigbtn" onclick="stockRequestPost('${d.id}')">${L('确认期初入库','Post opening stock')}</button>`:''}</div>`).join('')}</div>`;
function stockRequestApprove(id){const d=DB.get('stockreq',id);DB.put('stockreq',{...d,status:'approved',approval:{by:meId(),t:Date.now()}});render(false)}
async function stockRequestPost(id){const d=DB.get('stockreq',id);if(!d||d.status!=='approved')return;d.items.forEach((i,n)=>addMove({id:d.id+'_'+n,pid:i.pid,wh:d.wh,qty:+i.qty,uc:+i.uc,batch:i.batch||'',type:'init',ref:id}));DB.put('stockreq',{...d,status:'done'});await commitBusiness([id]);toast(L('期初入库已同步','Opening inventory posted'),false);render(false)}

const enterpriseWork=V.work;V.work=()=>enterpriseWork()+`<div class="pad"><div class="wtiles"><button class="bigbtn ghost" onclick="go('leave')">${L('请假与审批','Leave & approvals')} ${DB.all('leave').filter(leaveCan).length?`<span class="badge b-red">${DB.all('leave').filter(leaveCan).length}</span>`:''}</button>${can('stock')?`<button class="bigbtn ghost" onclick="go('stock_requests')">${L('期初库存审批','Opening stock')}</button>`:''}</div></div>`;

const enterpriseSale=V.so_view;V.so_view=()=>{const h=enterpriseSale(),d=DB.get('so',S.params.id);if(!d)return h;const receipt=DB.all('receipt').find(x=>x.so===d.id);return h+`<div class="pad">${receipt?`<div class="box"><b>${L('客户已签收','Customer received')}</b> · ${esc(receipt.customerName)} · ${fdate(receipt.t)}<div><img src="${esc(receipt.photo)}" style="max-width:100%;max-height:220px"><img src="${esc(receipt.signature)}" style="max-width:100%;height:100px;background:white"></div></div>`:['shipped','done'].includes(d.status)&&(['chair','gm','keeper'].includes(S.me.role)||d.by===meId())?`<button class="bigbtn" onclick="deliveryForm('${d.id}')">${L('客户签收：拍照 + 手写签名','Customer receipt: photo + signature')}</button>`:`<div class="xs muted">${L('尚未出库，不能签收','Receipt available after shipment')}</div>`}</div>`};

const enterpriseAlertScan=Alerts.scan.bind(Alerts);Alerts.scan=function(rows,show=true){enterpriseAlertScan(rows,show);rows.forEach(({k,d})=>{if(k==='msg'&&show&&d.by!==meId()&&!d.rc&&(!d.mem||d.mem.includes(meId())))noticeSound();if(k==='leave'&&(leaveCan(d)||d.by===meId()&&d.status!=='submitted'))this.add({key:'leave_'+d.id+'_'+d.status,ic:'clock',zh:leaveCan(d)?'有请假申请待您审批':'您的请假申请已处理',en:leaveCan(d)?'A leave request needs approval':'Your leave request was reviewed',go:['leave',{}]},show)})};

const enterpriseOpenSheet=openSheet;openSheet=function(h,force){if(/(?:finRecv|finPay\(|expDo\([^)]*,true|soFinOk)/.test(h)&&!/sfN/.test(h))h+=moneyAccountPicker();return enterpriseOpenSheet(h,force)};
function moneyAccountForm(id){const a=DB.get('account',id)||{kind:'bank',name:''};openSheet(`<div class="sh">${L('资金账户','Money account')}</div><label>${L('账户名称','Account name')}</label><input id="maName" class="inp" value="${esc(a.name)}"><label>${L('类型','Type')}</label><select class="inp" id="maKind">${['cash','bank','momo'].map(k=>`<option ${k===a.kind?'selected':''}>${k}</option>`).join('')}</select><div class="note-y">${L('这里只建立记账账户，不开立真实银行账户。启用前应核对账户归属；期初余额须单独审批导入。','This creates a bookkeeping account, not a real bank account. Verify ownership; opening balances require separate approval.')}</div><button class="bigbtn" onclick="moneyAccountSave('${id||''}')">${L('确认配置','Configure')}</button>`)}
function moneyAccountSave(id){const name=$('#maName').value.trim(),kind=$('#maKind').value;if(name.length<2)return toast(L('请输入名称','Enter a name'));const a=DB.get('account',id);if(a&&a.kind!==kind)return toast(L('已有账户不可更换类型，请新建','Create a new account to use a different type'));DB.put('account',{...(a||{}),id:id||uid('acc'),name,kind,configured:true,currency:'GHS'});closeSheet(true);render(false)}
V.money_accounts=()=>hdr(L('资金账户与对账','Money accounts & reconciliation'),can('mgmt')||own('fin_verify')?`<button class="pill" onclick="moneyAccountForm()">+ ${L('账户','Account')}</button>`:'')+`<div class="pad"><div class="note-y">${L('余额从新启用的服务端凭证计算。旧数据与期初资金尚未核对导入时，不能当作实际银行余额。','Balances include new server journal entries. Reconcile legacy data and approved opening balances before using them as actual balances.')}</div><button class="bigbtn ghost" onclick="financeLoad('money_accounts')">${L('刷新服务器余额','Refresh server balances')}</button>${DB.all('account').map(a=>{const b=(S.financeData?.cash||[]).find(x=>x.cash_account===a.id)?.balance;return `<div class="box"><b>${esc(a.name)}</b> · ${esc(a.kind)}<div>${a.configured?(b==null?L('尚未加载','Not loaded'):moneyBase(+b)):L('待配置，禁止过账','Not configured; posting blocked')}</div><div class="row gap">${['chair','acct'].includes(S.me.role)?`<button class="pill" onclick="moneyAccountForm('${a.id}')">${L('配置','Configure')}</button>`:''}${a.configured?`<button class="pill" onclick="reconcileForm('${a.id}')">${a.kind==='cash'?L('每日盘点','Daily count'):L('月度对账','Monthly reconciliation')}</button>`:''}</div></div>`}).join('')}<div class="sec-h">${L('对账记录','Reconciliations')}</div>${DB.all('reconcile').map(r=>`<div class="box">${esc((DB.get('account',r.accountId)||{}).name)} · ${esc(r.date)}<div>${L('账面','Book')} ${money(r.book)} / ${L('实有','Actual')} ${money(r.actual)} / ${L('差异','Difference')} <b class="${r.difference?'red':'green'}">${money(r.difference)}</b></div><div>${esc(r.note||'')}</div></div>`).join('')}</div>`;
async function financeLoad(view='ledger'){try{S.financeData=await rpc('jxc_finance_report',{p_token:S.token,p_from:S.financeFrom||dayKey(Date.now()).slice(0,7)+'-01',p_to:S.financeTo||dayKey(Date.now())});S.view=view;render(false)}catch(e){toast(String(e.message||e))}}

async function transferPost(id){const d=DB.get('transfer',id);if(!d||!['approved','transit'].includes(d.status))return;const out=d.status==='approved';try{const plans=d.items.map(i=>[i,out?allocate(i.pid,d.fromWh,+i.qty):DB.all('moves').filter(m=>m.type==='tr_out'&&m.ref===id&&m.pid===i.pid).map(m=>({...m,qty:-m.qty}))]);if(plans.some(([i,a])=>!a))throw new Error(L('调出仓库存不足','Insufficient source stock'));plans.forEach(([i,a])=>a.forEach((b,n)=>addMove({id:id+'_'+(out?'out':'in')+'_'+i.pid+'_'+n,pid:i.pid,wh:out?d.fromWh:d.toWh,qty:(out?-1:1)*b.qty,batch:b.batch||'',uc:b.uc??avgCost(i.pid),type:out?'tr_out':'tr_in',ref:id})));DB.put('transfer',{...d,status:out?'transit':'done',receivedBy:meId()});await commitBusiness([id]);render(false)}catch(e){toast(String(e.message||e))}}

async function commitBusiness(ids){if(!navigator.onLine&&DB.cloud)throw new Error(L('网络未连接，记录仍待同步','Offline; records are still pending'));const start=Date.now();while(Date.now()-start<30000){if(!S.syncing)await Sync.run();if(S.syncErr)throw new Error(S.syncErr);if(!DB.outbox.some(o=>ids.includes(o.id)))return;await new Promise(r=>setTimeout(r,120))}throw new Error(L('等待同步超时，请保留页面重试','Sync timed out; keep this page and retry'))}
attSave=async function(){if(!own('att')||S.attSaving)return;const a=S.att;if(S.photoBusy||!a?.photo)return toast(L('请先完成现场拍照','Complete the site photo first'));if(a.type==='visit'&&!a.cus&&!a.note)return toast(L('请选择客户或填写备注','Choose a customer or add a note'));S.attSaving=true;try{const d=DB.get('att',a.recordId)||DB.put('att',{id:a.recordId,type:a.type,t:a.recordT||Date.now(),lat:a.lat,lng:a.lng,acc:a.acc,approx:!!a.approx,addr:a.addr,photo:a.photo,thumb:a.thumb,cus:a.cus||'',note:a.note||'',wh:S.me.wh});a.recordId=d.id;a.recordT=d.t;LS.set('attDraft_'+meId(),a);await commitBusiness([d.id]);LS.del('attDraft_'+meId());closeSheet(true);toast(L('拍照打卡已保存并同步','Photo check-in saved and synced'),false);render(false)}catch(e){attSheet();toast(L('照片已保留，请联网后重试：','Photo retained; reconnect and retry: ')+String(e.message||e))}finally{S.attSaving=false}};

function confirmedRevenue(from,to=Infinity){return Math.round(DB.all('moves').filter(m=>m.t>=from&&m.t<to&&['so_out','so_ret'].includes(m.type)).reduce((a,m)=>{let amount=m.revenue;if(amount==null){const sale=m.type==='so_out'?DB.get('so',m.ref):DB.get('so',(DB.get('sr',m.ref)||{}).so),line=sale?.items?.find(i=>i.pid===m.pid);amount=line?Math.abs(+m.qty)*(+line.price||0):0}return a+(m.type==='so_out'?1:-1)*(+amount||0)},0)*100)/100}

/* XLSX import without executing workbook macros or formulas. Only first-sheet cell values are read. */
async function workbookRows(file){
 if(file.size>8*1024*1024)throw new Error(L('文件最多8MB','Maximum file size: 8MB'));
 if(/\.csv$/i.test(file.name))return importCSV(await file.text());

function vehicleParse(text){const compact=String(text).replace(/[|丨]/g,' ').replace(/车\s*型/g,'车型').replace(/车\s*架\s*号/g,'车架号').replace(/电\s*机\s*号/g,'电机号').replace(/配\s*置/g,'配置').replace(/颜\s*色/g,'颜色').replace(/日\s*期/g,'日期').replace(/整\s*车\s*码/g,'整车码');const result={};for(const [key,zh] of VEHICLE_FIELDS){const match=compact.match(new RegExp(zh+'\\s*[:：]?\\s*([\\s\\S]*?)(?=车型|车架号|电机号|配置|颜色|日期|整车码|$)'));if(match)result[key]=match[1].replace(/\s+/g,'').replace(/^[：:]+/,'').trim()}const flat=compact.replace(/\s+/g,'').toUpperCase(),vin=flat.match(/[A-HJ-NPR-Z0-9]{17}/),date=flat.match(/20\d{2}[-/.]\d{1,2}[-/.]\d{1,2}/);if(vin)result.vin=vin[0];if(date){const [y,m,d]=date[0].split(/[-/.]/);result.date=y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0')}const code=flat.match(/JH\d{8,20}/);if(code)result.vehicleCode=code[0];for(const key of ['vin','motor','vehicleCode'])if(result[key])result[key]=result[key].replace(/[^A-Z0-9-]/g,'').slice(0,64);return result}
async function vehicleScript(file,global){if(window[global])return window[global];await new Promise((ok,no)=>{const s=document.createElement('script');s.src='vendor/ocr/'+file;s.onload=ok;s.onerror=()=>{s.remove();no(Error(L('识别组件下载失败，请联网重试','Could not load recognition components; reconnect and retry')))};document.head.appendChild(s)});return window[global]}
async function vehicleOpen(){if(!vehicleAllowed()||S.me.role==='acct')return;try{vehicleDraft=await localAsset('get','vehicle-draft:'+meId())||{id:uid('vehicle'),by:meId(),t:Date.now(),status:'draft'};go('vehicle_scan')}catch(e){toast(L('无法保存本地草稿，请检查手机储存空间','Cannot save drafts; check device storage'))}}
async function vehicleAutoSave(){if(!vehicleDraft||!S.me||vehicleDraft.by!==meId())return;try{await localAsset('put','vehicle-draft:'+meId(),vehicleDraft)}catch(e){toast(L('草稿保存失败，请检查储存空间，勿关闭页面','Draft could not be saved; check storage and keep this page open'))}}
function vehicleField(key,value){if(!vehicleDraft)return;vehicleDraft[key]=value;if(VEHICLE_FIELDS.some(([k])=>k===key)){vehicleDraft.manualFields=[...new Set([...(vehicleDraft.manualFields||[]),key])]};clearTimeout(vehicleDraftTimer);vehicleDraftTimer=setTimeout(vehicleAutoSave,300)}
V.vehicle_scan=()=>{if(!vehicleAllowed()||!vehicleDraft)return hdr(L('车辆铭牌识别','Vehicle label scan'));const d=vehicleDraft;return hdr(L('车辆铭牌识别','Vehicle label scan'))+`<div class="pad"><div class="note-g">${L('AI图片识别：一次只拍一张铭牌，尽量铺满画面、避开反光。照片会发给Google识别，草稿保留在本机；核对后才能归档入库。','AI image recognition: capture one label, fill the frame and avoid glare. Images are sent to Google; drafts stay on this device until reviewed and archived.')}</div><div class="row gap"><button class="bigbtn" onclick="vehicleCapture()">${L('拍照识别','Capture')}</button><button class="bigbtn ghost" onclick="vehicleUpload()">${L('上传图片','Upload image')}</button></div>${d.photo?`<img src="${esc(d.photo)}" style="width:100%;max-height:310px;object-fit:contain;margin-top:12px" onclick="viewImg(vehicleDraft.photo)"><button class="pill" onclick="vehicleRecognize()">${L('重新AI识别','Recognize with AI again')}</button>`:''}<div id="vehicleProgress" class="sm muted">${esc(d.scanMessage||'')}</div>${d.photo?`<div class="row gap" style="margin-top:10px"><button class="pill" onclick="vehicleRecognize('local')">${L('离线基础识别','Basic offline OCR')}</button><button class="pill" onclick="viewImg(vehicleDraft.ocrImage||vehicleDraft.photo)">${L('放大原图核对','Zoom original')}</button></div>`:''}${VEHICLE_FIELDS.map(([k,z,e])=>`<div class="fld"><label>${L(z,e)} ${(d.scanUncertain||[]).includes(k)?`<span class="vehicle-check">${L('重点核对','Check carefully')}</span>`:''}</label><input class="inp ${(d.scanUncertain||[]).includes(k)?'vehicle-uncertain':''}" id="vehicle_${k}" value="${esc(d[k]||'')}" ${k==='date'?'type="date"':''} oninput="vehicleField('${k}',this.value)">${d.manualFields?.includes(k)&&d.aiCandidates?.[k]&&d.aiCandidates[k]!==d[k]?`<div class="xs muted">${L('AI建议：','AI suggests: ')}${esc(d.aiCandidates[k])} <button class="pill" onclick="vehicleUseCandidate('${k}')">${L('采用','Use')}</button></div>`:''}</div>`).join('')}<div class="fld"><label>${L('对应库存商品','Inventory product')}</label><select class="inp" id="vehicle_productId" onchange="vehicleField('productId',this.value)"><option value="">${L('稍后关联','Link later')}</option>${DB.all('products').map(p=>`<option value="${esc(p.id)}" ${d.productId===p.id?'selected':''}>${esc(pName(p.id))}</option>`).join('')}</select></div><label class="row gap"><input type="checkbox" id="vehicle_review">${L('已对照原图核对所有字段','I checked every field against the image')}</label><button class="bigbtn" onclick="vehicleSave()">${L('确认归档、生成条码和二维码','Archive & generate barcodes / QR')}</button><div class="xs muted">${L('归档不会直接增加库存；入库仍需审批。','Archiving does not increase stock; intake requires approval.')}</div></div>`};
function vehicleUpload(){if(S.vehicleRecognizing||S.me?.role==='acct')return;const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>input.files[0]&&vehicleImage(input.files[0]);input.click()}
function vehicleCapture(){if(S.vehicleRecognizing)return;camShot(vehicleImage,()=>{})}
async function vehiclePrepareImage(file){if(file.size>25*1024*1024)throw Error(L('图片不能超过25MB','Maximum image size is 25MB'));const url=URL.createObjectURL(file);try{const image=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error(L('无法读取图片，请使用JPG、PNG或WebP','Cannot read image; use JPG, PNG or WebP')));im.src=url});if(Math.min(image.width,image.height)<400)throw Error(L('图片太小，请靠近铭牌重新拍摄','Image is too small; take a closer photo'));const c=document.createElement('canvas'),scale=Math.min(1,2600/Math.max(image.width,image.height));c.width=Math.round(image.width*scale);c.height=Math.round(image.height*scale);c.getContext('2d').drawImage(image,0,0,c.width,c.height);let ocrImage=c.toDataURL('image/jpeg',.94);if(ocrImage.length>3400000)ocrImage=c.toDataURL('image/jpeg',.86);if(ocrImage.length>3800000)throw Error(L('图片太大，请只拍摄铭牌区域','Image is too large; photograph the label area only'));const small=document.createElement('canvas'),factor=Math.min(1,1400/Math.max(c.width,c.height));small.width=Math.round(c.width*factor);small.height=Math.round(c.height*factor);small.getContext('2d').drawImage(c,0,0,small.width,small.height);return {ocrImage,photo:small.toDataURL('image/jpeg',.86)}}finally{URL.revokeObjectURL(url)}}
async function vehicleImage(file){if(!vehicleDraft||S.vehicleRecognizing)return;try{const images=await vehiclePrepareImage(file);vehicleDraft={id:uid('vehicle'),by:meId(),t:Date.now(),status:'draft',...images,manualFields:[],scanUncertain:[],scanMessage:L('图片已保存，正在AI识别…','Image saved; recognizing with AI…')};await vehicleAutoSave();render(false);await vehicleRecognize()}catch(e){toast(String(e.message||e))}}
function vehicleApplyAI(d,result){d.aiCandidates=result.fields||{};for(const [key] of VEHICLE_FIELDS){if(!(d.manualFields||[]).includes(key))d[key]=String(result.fields?.[key]||'')}d.scanUncertain=result.uncertain||[];d.scanProvider=result.provider||'Gemini';d.scanMessage=d.scanUncertain.length?L(`AI识别完成，${d.scanUncertain.length}项请重点核对`,`AI recognition complete; check ${d.scanUncertain.length} fields carefully`):L('AI识别完成，请对照原图确认','AI recognition complete; confirm against the image');if(result.notes?.length)d.scanMessage+=' · '+result.notes.join('；');delete d.confidence}
function vehicleUseCandidate(key){if(!vehicleDraft?.aiCandidates)return;vehicleDraft[key]=vehicleDraft.aiCandidates[key]||'';vehicleDraft.manualFields=(vehicleDraft.manualFields||[]).filter(k=>k!==key);vehicleAutoSave();render(false)}
async function vehicleRecognize(mode='ai'){if(mode==='local')return vehicleRecognizeLocal();if(S.vehicleRecognizing||!vehicleDraft?.photo)return;if(!DB.cloud||!S.token)return toast(L('AI识别需要联网登录；也可手动选择离线基础识别','Sign in online for AI recognition, or choose basic offline OCR'));S.vehicleRecognizing=true;const d=vehicleDraft,user=meId();d.scanMessage=L('Gemini正在识别，请稍候…','Gemini is recognizing the label…');const el=$('#vehicleProgress');if(el)el.textContent=d.scanMessage;try{const response=await fetch(CFG.supabaseUrl+'/functions/v1/jxc-vehicle-ocr',{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey,'Content-Type':'application/json','x-jxc-session':S.token},body:JSON.stringify({image:d.ocrImage||d.photo,requestId:crypto.randomUUID(),force:!!d.scanProvider}),signal:AbortSignal.timeout(85000)});let result;try{result=await response.json()}catch{throw Error(L('AI识别服务未就绪，请联系管理员','AI recognition is not ready; contact the administrator'))}if(!response.ok)throw Error(result.message||L('AI识别失败，请稍后重试','AI recognition failed; try again later'));if(meId()!==user||vehicleDraft!==d)return;vehicleApplyAI(d,result);await vehicleAutoSave();render(false);toast(L('AI识别结果已保存，请核对后归档','AI results saved; review before archiving'),false)}catch(e){d.scanMessage=L('AI识别未完成，原图和草稿已保留：','AI recognition incomplete; original and draft retained: ')+String(e.message||e);await vehicleAutoSave();if(meId()===user&&vehicleDraft===d){render(false);toast(d.scanMessage)}}finally{S.vehicleRecognizing=false}}
async function vehicleRecognizeLocal(){if(S.vehicleRecognizing||!vehicleDraft?.photo)return;S.vehicleRecognizing=true;const d=vehicleDraft,user=meId();try{const T=await vehicleScript('tesseract.min.js','Tesseract'),root=new URL('vendor/ocr/',location.href).href;vehicleOCRWorker=await T.createWorker(['chi_sim','eng'],1,{workerPath:root+'worker.min.js',corePath:root,langPath:root,workerBlobURL:false,logger:p=>{const el=$('#vehicleProgress');if(el)el.textContent=L('本机识别中：','Recognizing locally: ')+Math.round((p.progress||0)*100)+'%'}});await vehicleOCRWorker.setParameters({tessedit_pageseg_mode:'11'});const {data}=await vehicleOCRWorker.recognize(d.photo);if(meId()!==user||vehicleDraft!==d)return;d.ocrText=data.text;d.confidence=data.confidence;const fields=vehicleParse(data.text);for(const [k] of VEHICLE_FIELDS)if(!(d.manualFields||[]).includes(k))d[k]=fields[k]||'';d.scanUncertain=VEHICLE_FIELDS.map(([k])=>k);d.scanProvider='Local OCR';d.scanMessage=L('基础OCR准确率有限，建议联网使用AI识别','Basic OCR has limited accuracy; use online AI recognition');await vehicleAutoSave();render(false);toast(L('识别草稿已保存，请对照原图修正后归档','Recognition draft saved. Review and correct before archiving'),false)}catch(e){toast(L('识别未完成，图片与草稿已保留，可手工填写：','Recognition incomplete; image and draft retained. You can enter fields manually: ')+String(e.message||e))}finally{try{await vehicleOCRWorker?.terminate()}catch(e){}vehicleOCRWorker=null;S.vehicleRecognizing=false}}
async function vehicleSave(){if(!vehicleDraft||S.savingVehicle)return;const d={...vehicleDraft};delete d.ocrImage;delete d.aiCandidates;delete d.manualFields;for(const [k] of VEHICLE_FIELDS)d[k]=String($('#vehicle_'+k)?.value||d[k]||'').trim();if(!d.photo||VEHICLE_FIELDS.some(([k])=>!d[k])||!$('#vehicle_review').checked)return toast(L('请填写全部字段并核对原图','Complete every field and confirm the image review'));for(const k of ['vin','motor','vehicleCode']){d[k]=d[k].toUpperCase();if(!/^[A-Z0-9-]{3,64}$/.test(d[k]))return toast(L('号码只能包含字母、数字和连字符','Identifiers must contain only letters, digits and hyphens'))}if(d.vin.length!==17)return toast(L('请核对17位车架号','Verify the 17-character chassis number'));if(DB.all('vehicle').some(v=>v.status==='saved'&&v.vin===d.vin&&v.id!==d.id))return toast(L('该车架号已归档，请勿重复入库','This VIN is already archived; do not duplicate intake'));S.savingVehicle=true;try{d.photo=await upImg(d.photo);DB.put('vehicle',{...d,status:'saved',reviewedAt:Date.now(),reviewedBy:meId()});await commitBusiness([d.id]);await localAsset('delete','vehicle-draft:'+meId());vehicleDraft=null;finish('vehicle_view',{id:d.id});toast(L('车辆档案已保存并同步','Vehicle archive saved and synced'),false)}catch(e){toast(L('归档未同步，草稿仍保留：','Archive not synced; draft retained: ')+String(e.message||e))}finally{S.savingVehicle=false}}
V.vehicles=()=>hdr(L('车辆识别档案','Vehicle archives'),`<button class="pill" onclick="vehicleOpen()">+ ${L('扫描','Scan')}</button>`)+`<div class="pad"><input class="inp" placeholder="${L('车型 / 车架号 / 电机号 / 整车码','Model / VIN / motor / vehicle code')}" value="${esc(S.vehicleQuery||'')}" oninput="S.vehicleQuery=this.value;vehicleSearchResults()"><div id="vehicleResults">${vehicleRows()}</div></div>`;
function vehicleRows(){const q=(S.vehicleQuery||'').toLowerCase();return DB.all('vehicle').filter(v=>v.status==='saved'&&VEHICLE_FIELDS.some(([k])=>String(v[k]||'').toLowerCase().includes(q))).sort((a,b)=>b.t-a.t).map(v=>`<div class="box" onclick="go('vehicle_view',{id:'${v.id}'})"><b>${esc(v.model)}</b><div>${esc(v.vin)}</div><div class="xs muted">${esc(v.motor)} · ${esc(v.color)}</div></div>`).join('')||emptyBox('box',L('暂无车辆档案','No vehicle archives'))}
function vehicleSearchResults(){const el=$('#vehicleResults');if(el)el.innerHTML=vehicleRows()}
V.vehicle_view=()=>{const d=DB.get('vehicle',S.params.id);if(!d)return hdr('');requestAnimationFrame(()=>vehicleLabelPreview(d.id));return hdr(L('车辆档案','Vehicle archive'))+`<div class="pad"><div class="box">${VEHICLE_FIELDS.map(([k,z,e])=>`<div class="li"><b style="min-width:85px">${L(z,e)}</b><span style="overflow-wrap:anywhere">${esc(d[k])}</span></div>`).join('')}<div class="xs muted">${d._q?L('待同步','Pending sync'):L('已同步归档','Synced archive')}</div></div><img src="${esc(d.photo)}" style="width:100%;max-height:230px;object-fit:contain" onclick="viewImg('${esc(d.photo)}')"><div class="box" id="vehicleCodes"></div><div class="row gap"><button class="bigbtn ghost" onclick="vehicleDownload('${d.id}')">${L('保存标签图片','Save label image')}</button><button class="bigbtn" onclick="vehiclePrint('${d.id}')">${L('打印标签','Print label')}</button></div>${['chair','gm','buyer','clerk','keeper'].includes(S.me.role)?`<div class="box"><h4>${L('按审批流程加入库存','Add stock via approvals')}</h4><div class="fld"><label>${L('对应商品','Product')}</label><select class="inp" id="vehicleStockProduct">${DB.all('products').map(p=>`<option value="${p.id}" ${d.productId===p.id?'selected':''}>${esc(pName(p.id))}</option>`).join('')}</select></div><label>${L('仓库','Warehouse')}</label><select class="inp" id="vehicleStockWh">${activeWh().map(w=>`<option value="${w.id}">${esc(whName(w.id))}</option>`).join('')}</select><label>${L('已下单采购单','Ordered purchase order')}</label><select class="inp" id="vehicleStockPO"><option value="">${L('请选择','Choose')}</option>${DB.all('po').filter(p=>p.status==='ordered').map(p=>`<option value="${p.id}">${esc(p.no)}</option>`).join('')}</select><button class="bigbtn" onclick="vehicleIntake('${d.id}','grn')">${L('生成1台待审批入库单','Create intake request for 1 vehicle')}</button><div class="xs muted">${L('财务审批 → 内勤确认 → 库管入库；以车架号作为批号。','Finance → clerk → warehouse. VIN is the batch number.')}</div><div class="fld"><label>${L('仅期初盘存：单位成本（GHS）','Opening inventory only: unit cost (GHS)')}</label><input class="inp" type="number" id="vehicleStockCost" min="0" step=".01"></div><button class="bigbtn ghost" onclick="vehicleIntake('${d.id}','opening')">${L('生成期初库存审批申请','Request opening-stock approval')}</button></div>`:''}</div>`};
async function vehicleLabelCanvas(id){const d=DB.get('vehicle',id);if(!d)throw Error('Missing archive');const codes=await vehicleScript('codes.min.js','VehicleCodes'),canvas=document.createElement('canvas');canvas.width=1000;canvas.height=1420;const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,1000,1420);c.fillStyle='#111';c.font='bold 36px sans-serif';c.fillText('华宝进销存 · VEHICLE LABEL',35,55);let y=100;for(const [k,z,e] of VEHICLE_FIELDS){c.font='bold 24px sans-serif';c.fillText(z+' / '+e,35,y);c.font='28px sans-serif';const lines=String(d[k]).match(/.{1,38}/gu)||[''];for(const line of lines){y+=36;c.fillText(line,35,y)}y+=32;if(['vin','motor','vehicleCode'].includes(k)){const b=document.createElement('canvas');codes.JsBarcode(b,d[k],{format:'CODE128',width:2,height:70,displayValue:false,margin:8});c.drawImage(b,35,y,Math.min(920,b.width),85);y+=105}}const qr=await codes.QRCode.toDataURL(JSON.stringify(Object.fromEntries(VEHICLE_FIELDS.map(([k])=>[k,d[k]]))),{width:250,margin:2,errorCorrectionLevel:'M'});const image=new Image();await new Promise((ok,no)=>{image.onload=ok;image.onerror=no;image.src=qr});if(y+260>canvas.height){const copy=document.createElement('canvas');copy.width=1000;copy.height=y+280;copy.getContext('2d').fillStyle='#fff';copy.getContext('2d').fillRect(0,0,copy.width,copy.height);copy.getContext('2d').drawImage(canvas,0,0);copy.getContext('2d').drawImage(image,710,y,250,250);return copy}c.drawImage(image,710,y,250,250);return canvas}
async function vehicleLabelPreview(id){try{const canvas=await vehicleLabelCanvas(id),el=$('#vehicleCodes');if(el&&S.params.id===id)el.innerHTML=`<img src="${canvas.toDataURL('image/png')}" style="width:100%" alt="Regenerated vehicle barcodes and QR">`}catch(e){const el=$('#vehicleCodes');if(el)el.textContent=String(e.message||e)}}
async function vehicleDownload(id){try{const c=await vehicleLabelCanvas(id),a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='vehicle-'+DB.get('vehicle',id).vin+'.png';a.click()}catch(e){toast(String(e.message||e))}}
async function vehiclePrint(id){try{const c=await vehicleLabelCanvas(id);window._pvH=`<!doctype html><html><head><meta charset="utf-8"><title>Vehicle label</title><style>@page{margin:8mm}img{width:100%;max-width:180mm}</style></head><body><img src="${c.toDataURL('image/png')}"></body></html>`;openSheet(`<div class="sh">${L('车辆标签','Vehicle label')}</div><iframe id="pvF" style="width:100%;height:55vh;border:0"></iframe><button class="bigbtn" onclick="pvPrint()">${L('打印 / 保存PDF','Print / save PDF')}</button>`);$('#pvF').srcdoc=window._pvH}catch(e){toast(String(e.message||e))}}
async function vehicleIntake(id,mode){const d=DB.get('vehicle',id),pid=$('#vehicleStockProduct').value,wh=$('#vehicleStockWh').value;if(!d||d._q||!pid||!wh)return toast(L('请先同步车辆档案并选择商品和仓库','Sync the archive and choose a product and warehouse'));if(DB.all('grn').some(g=>g.vehicleId===id&&g.status!=='rejected')||DB.all('stockreq').some(g=>g.vehicleId===id&&g.status!=='rejected'))return toast(L('这辆车已有入库申请，请在原单据继续处理','This vehicle already has an intake request; continue with the existing document'));if(S.vehicleIntakeBusy)return;S.vehicleIntakeBusy=true;try{let request;if(mode==='grn'){const po=DB.get('po',$('#vehicleStockPO').value);if(!po||po.status!=='ordered'||po.wh!==wh||!po.items.some(i=>i.pid===pid)||grnRemaining(po,pid)<1)throw Error(L('采购单、仓库或剩余数量不匹配','PO, warehouse or remaining quantity does not match'));request=DB.put('grn',{id:'vehiclegrn_'+id,no:genNo('GR'),batch:d.vin,vehicleId:id,po:po.id,wh,status:'submitted',t:Date.now(),items:[{pid,qty:1,batch:d.vin,exp:''}]})}else{const raw=$('#vehicleStockCost').value,uc=Number(raw);if(!raw||!Number.isFinite(uc)||uc<0)throw Error(L('请填写实际期初成本，不能推测成本','Enter the actual opening cost; do not invent a cost'));request=DB.put('stockreq',{id:'vehicleopening_'+id,type:'opening',vehicleId:id,status:'pending',wh,items:[{pid,qty:1,uc,batch:d.vin}],t:Date.now()})}await commitBusiness([request.id]);go(mode==='grn'?'grn_view':'stock_requests',mode==='grn'?{id:request.id}:{});toast(L('已提交审批，尚未增加库存','Submitted for approval; stock is unchanged'),false)}catch(e){toast(String(e.message||e))}finally{S.vehicleIntakeBusy=false}}

['vehicles','vehicle_scan','vehicle_view'].forEach(v=>LIVE.add(v));

const personLine=(u,large=false)=>`<div class="person-line"><b class="person-name ${large?'person-large':'sm'}">${esc(nmP(u.name))}</b><span class="badge ${ROLES[u.role]?.c||'b-grey'}">${esc(userTitle(u))}</span></div>`;
function avatarSheet(){if(!S.me)return;openSheet(`<div class="sh">${L('修改我的头像','Change my avatar')}</div><div class="row gap" style="margin-bottom:14px">${avatar(meId(),72)}<div class="sm muted">${L('照片、表情或图案会同步显示给同事','Photos, emoji and icons sync to colleagues')}</div></div><button class="bigbtn" onclick="avatarUpload()">${L('上传照片 / 表情图片','Upload photo / sticker image')}</button><div class="chips wrap" style="margin-top:16px">${['🐼','😊','😎','🌻','🌸','⭐','🦁','🐯','🐱','🐶','🚗','🏍️','🌈','🍀','💎','🚀'].map(e=>`<button class="pill" style="font-size:30px;height:54px" onclick="avatarSave({emoji:'${e}',photo:''})">${e}</button>`).join('')}</div><div class="fld"><label>${L('自定义表情 / 符号','Custom emoji / symbol')}</label><input class="inp" id="avatarEmoji" maxlength="16" placeholder="😊"><button class="pill" onclick="avatarSave({emoji:$('#avatarEmoji').value.trim(),photo:''})">${L('使用符号','Use symbol')}</button></div><button class="bigbtn ghost" onclick="avatarSave({emoji:'',photo:''})">${L('恢复姓名首字头像','Restore name initial')}</button>`)}
function avatarUpload(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const photo=await resizeImg(f,360);await avatarSave({photo:await upImg(photo),emoji:''})}catch(e){toast(L('图片保存失败：','Image save failed: ')+String(e.message||e))}};i.click()}
async function avatarSave(value){if(S.avatarSaving)return;S.avatarSaving=true;try{const old=DB.get('profile',meId())||{};DB.put('profile',{...old,...value,id:meId(),userId:meId(),by:meId(),t:old.t||Date.now()});await commitBusiness([meId()]);closeSheet(true);render(false);toast(L('头像已保存并同步','Avatar saved and synced'),false)}catch(e){toast(L('头像尚未同步，请检查网络：','Avatar not synced; check your network: ')+String(e.message||e))}finally{S.avatarSaving=false}}
/* Keep every work entry in the same colored grid, including operational extensions. */
V.work=()=>{const cards=[],add=(ok,bg,icon,title,sub,action,count)=>{if(ok)cards.push(`<div class="wtile" style="background:${bg};position:relative" onclick="${action}"><div class="wti">${ic(icon)}</div><div style="min-width:0"><div class="b">${title}</div>${sub?`<div class="wsub">${sub}</div>`:''}</div>${count?`<span class="badge b-red" style="position:absolute;top:10px;right:10px">${count}</span>`:''}</div>`)};
 add(true,'#527047','clock',L('请假与审批','Leave & approvals'),L('申请 · 待办 · 审批结果','Request · review · results'),"go('leave')",DB.all('leave').filter(leaveCan).length);
 add(can('stock'),'#9A6030','box',L('期初库存审批','Opening inventory'),L('申请 · 审批 · 入库','Request · approve · receive'),"go('stock_requests')");
 add(true,'#345E83','chart',L('经营控制','Business controls'),' ',"go('business_control')");
 add(['chair','acct'].includes(S.me.role),'#287D61','download',L('Excel批量导入','Excel import'),L('上传表格 · 预览校验','Upload · preview · validate'),"go('import_data')");
 add(true,'#7557A1','mic',L('本地语音识别','Local speech'),L('模型下载 · 识别语言','Model · spoken language'),"speechModelSettings()");
 add(vehicleAllowed(),'#A14D53','camera',L('车辆铭牌识别','Vehicle labels'),L('照片识别 · 条码档案','Image OCR · barcode archive'),"go('vehicles')");
 add(RELEASE_FINANCE_ENABLED&&['chair','gm','ops','acct','cashier'].includes(S.me.role),'#47687A','calc',L('资金账户与对账','Money & reconciliation'),'',"go('money_accounts');financeLoad('money_accounts')");
 add(RELEASE_FINANCE_ENABLED&&['chair','gm','ops','acct','cashier'].includes(S.me.role),'#5F597D','doc',L('总账与财务报表','Ledger & statements'),'',"go('ledger');financeLoad()");
 add(RELEASE_FINANCE_ENABLED&&['chair','acct','ops'].includes(S.me.role),'#856140','calc',L('期初资金与欠款','Opening balances'),'',"go('opening_balances')");
 return enterpriseWork().replace(/<\/div><\/div>$/,cards.join('')+'</div></div>')};
V.business_control=()=>hdr(L('经营控制','Business controls'))+`<div class="pad business-controls"><div class="control-menu">${[['receivables','应收、信用与账龄','Receivables & credit','calc','#2367B0'],['payables','应付与付款计划','Payables & plan','doc','#7B4FA0'],['price_lists','零售 / 批发 / VIP价格','Price lists','receipt','#A26B29'],['transfers','仓库调拨','Warehouse transfers','truck','#0E7C86'],['replenishment','补货建议','Replenishment','box','#527047']].map(([v,z,e,icon,color])=>`<button class="control-row" style="--accent:${color}" onclick="go('${v}')"><span class="control-icon">${ic(icon,24)}</span><span class="control-title">${L(z,e)}</span>${ic('chev',20)}</button>`).join('')}</div></div>`;

/* ================= 启动 ================= */
async function boot(){
  await cloudProbe();DB.load();
  /* v1.1：账号改为按部门密码登录，本机演示数据需要重建一次 */
  if(!DB.cloud&&/[?&]demo=1/.test(location.search)&&!LS.get('demo1',0)){await seedDemo();LS.set('demo1',1);LS.set('start4',1);LS.del(SK);}
  if(!DB.cloud&&!LS.get('start4',0)){await seedBlank();LS.set('start4',1);LS.del('setupDone');LS.del('setupUsers');LS.del(SK);Object.keys(localStorage).filter(k=>k.startsWith('jxc_notes')).forEach(k=>localStorage.removeItem(k))}
  /* 国家：手动选过就用手动的，否则按时区 / 手机语言自动识别；语言：手动选过的优先，否则匹配手机语言 */
  const cs=LS.get('country',null);S.country=cs&&cs.manual&&AF[cs.code]?cs.code:detectCountry();
  const lm=LS.get('lang',null),ls=langsOf(S.country);S.lang=lm&&ls.includes(lm)?lm:pickLang(S.country);
  await setLang(S.lang,true);
  /* 首次使用某种语言：先把界面文字翻好再显示（最多等 4 秒），不会先出英文再变外文 */
  if(!['zh','en'].includes(S.lang))await Promise.race([ensureLang(S.lang),new Promise(r=>setTimeout(r,4000))]);
  S.online=navigator.onLine;
  if(restoreSession()){S.view=/mgmt/.test(location.hash)&&can('mgmt')?'mgmt':'home';Alerts.first()}else S.view='login';
  render(true);Sync.start();if(S.me){Sync.run('boot');bindPushRegistration()}
  /* 更新完成后，告诉用户更新了什么（只显示一次） */
  const from=LS.get('updFrom',null);if(from&&from!==APP_VER){LS.set('updFrom',null);setTimeout(async()=>{let v=null;try{v=await (await fetch('version.json?t='+Date.now(),{cache:'no-store'})).json()}catch(e){}
    openSheet(`<div class="sh">✓ ${L('已更新到','Updated to')} v${APP_VER}</div>${v&&v.version===APP_VER?updNotes(v):''}<button class="bigbtn" style="width:100%;margin-top:18px" onclick="closeSheet()">${L('好的','OK')}</button>`)},600)}
  /* 何时检查更新：启动后、回到前台、每 30 分钟 */
  if(location.protocol==='https:'){setTimeout(()=>checkUpdate(false),2500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});setInterval(()=>checkUpdate(false),30*60e3)}
}
/* 屏幕顶部插入下拉刷新提示 */
const _r0=render;render=function(top){_r0(top);const f=$('#screen .fade');if(f&&S.me&&!$('#ptr')){const p=document.createElement('div');p.id='ptr';p.className='ptr';f.prepend(p)}};
/* Android 返回键（App 内） */
(function(){const C=window.Capacitor;if(!C||!C.isNativePlatform||!C.isNativePlatform())return;const A=C.Plugins&&C.Plugins.App;if(!A)return;
  A.addListener('backButton',()=>{if(sheetOn())return closeSheet();if(S.hist.length)return back();if(S.view!=='home'&&S.me)return tab('home');A.exitApp()});
  A.addListener('resume',()=>{Sync.run();checkUpdate(false)})})();
if(!isNative()&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();

</script>
