<style>
:root{
  --bg:#F7F5F0;--card:#FFFFFF;--ink:#1C1C1E;--muted:#8A8478;--line:#ECE7DE;--soft:#F1ECDF;
  --purple:#7B4FA0;--lilac:#EFE6F6;--gold:#F2B705;--red:#D8432E;--lime:#E3F3EA;--orange:#E87A2B;--blue:#2367B0;--green:#0B7A4B;
  --tile:#C8552D;--r:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:#D9D2C1;background-image:linear-gradient(#cfc7b5 1px,transparent 1px),linear-gradient(90deg,#cfc7b5 1px,transparent 1px);background-size:32px 32px;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
.sbar{display:none}
@media (min-width:520px){
  .phone{width:390px;height:min(844px,calc(100vh - 32px));min-height:600px;border-radius:54px;border:11px solid #111;box-shadow:0 40px 80px rgba(0,0,0,.25)}
  .sbar{display:flex;position:absolute;top:0;left:0;right:0;height:46px;z-index:30;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:600;font-size:15px;pointer-events:none;background:var(--bg)}
  .sbar .island{width:110px;height:30px;background:#111;border-radius:20px}
  .phone .screen{top:46px}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;scrollbar-width:none;padding-top:env(safe-area-inset-top)}
.screen::-webkit-scrollbar{display:none}
.screen.nonav{padding-bottom:110px}
.pad{padding:14px 20px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.gap6{gap:6px}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.sm{font-size:12.5px}.xs{font-size:11px}.b{font-weight:700}.red{color:var(--red)}.green{color:var(--green)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fade{animation:fd .26s ease}@keyframes fd{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.logo{width:36px;height:36px;border-radius:12px;object-fit:cover}
.icbtn{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;position:relative;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.icbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.langbtn{display:inline-grid;place-items:center;border:0;border-radius:50%;background:var(--card);cursor:pointer;font-weight:800;font-size:13px;width:36px;height:36px;padding:0;color:#161616;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.syncchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:7px 11px;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.syncchip.off i{background:var(--orange)}.syncchip.busy i{background:var(--blue);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
.hero{font-size:29px;line-height:1.18;font-weight:800;letter-spacing:-.6px;margin:20px 0 4px;white-space:nowrap;overflow:hidden}
.hero .hl{background:var(--gold);padding:0 8px;border-radius:12px;display:inline-block;transform:rotate(-2deg)}
.slogan{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:2px;white-space:nowrap}
/* big entry cards (ChinaPaw welcome) */
.sc{border-radius:32px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s}
.sc:active,.wtile:active,.wc:active{transform:scale(.985)}
.sc .ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#111;flex:none}
.sc .go{width:37px;height:37px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#111;flex:none}
.sc .t{font-size:21px;font-weight:800;line-height:1.15;white-space:nowrap}
.sc .roles{font-size:12.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wtile{border-radius:24px;padding:14px 14px 15px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0;color:#fff;transition:transform .15s}
.wtile .b{font-size:15.5px;line-height:1.25;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtile .wsub{color:rgba(255,255,255,.82);margin-top:2px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wti{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.2);color:#fff}
.wcard{background:var(--card);border-radius:28px;padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer}
.wcard .qi{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;flex:none}
.wcard .go{width:34px;height:34px;border-radius:50%;background:#161616;color:#fff;display:grid;place-items:center;flex:none}
/* stats */
.stats{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--card);border-radius:20px;padding:12px;min-width:0}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.g{background:var(--green);color:#fff}.stat.g .l{color:rgba(255,255,255,.8)}
.stat.y{background:var(--gold)}.stat.y .l{color:rgba(0,0,0,.6)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;font-size:18px;font-weight:800}
.sec-h a{font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
/* search */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:30px;padding:6px 6px 6px 16px;color:var(--muted);margin-top:12px}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--ink);min-width:0;padding:8px 0}
.searchbar .scan{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{border-radius:30px;padding:8px 14px;font-size:13px;background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1.5px solid transparent;font-weight:600;flex:none}
.chip.on{background:#161616;color:#fff}
.chip.sm{padding:5px 10px;font-size:12px}
.chip .n{background:rgba(0,0,0,.08);border-radius:10px;padding:0 6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.2)}
.seg{display:flex;background:var(--card);border-radius:30px;padding:4px;margin:12px 0 4px}
.seg button{flex:1;padding:9px 4px;border-radius:26px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:#161616;color:#fff}
/* list cards (ChinaPaw job card) */
.wc{background:#fff;border:1px solid #D9CFB8;box-shadow:0 1px 3px rgba(60,45,10,.10);border-radius:16px;margin-bottom:9px;cursor:pointer;overflow:hidden;transition:transform .15s}
.wc .top{padding:9px 13px}
.wc h3{font-size:16.5px;font-weight:800;letter-spacing:-.3px;line-height:1.2;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wc h3 .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wc small{display:block;font-size:11.5px;color:#7A725F;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .tag{padding:1px 7px;font-size:10.5px;font-weight:700;border-radius:9px;background:#E3D7BC;color:#4A3A12;flex:none;line-height:1.5}
.badge{border-radius:30px;padding:3px 9px;font-size:11px;white-space:nowrap;font-weight:700;flex:none;display:inline-flex;align-items:center;gap:3px}
.b-green{background:var(--green);color:#fff}.b-red{background:var(--red);color:#fff}.b-gold{background:var(--gold);color:#161616}
.b-blue{background:var(--blue);color:#fff}.b-purple{background:var(--purple);color:#fff}.b-grey{background:#D6D3CC;color:#161616}
.b-orange{background:var(--orange);color:#fff}.b-dark{background:#161616;color:#fff}.b-lime{background:var(--lime);color:var(--green)}
.cols{display:flex;margin-top:5px}
.cols>div{flex:1;padding-right:6px;margin-right:7px;border-right:1px solid #D9CFB8;min-width:0;display:flex;align-items:baseline;gap:4px}
.cols>div:last-child{border:0;margin:0}
.cols>div:nth-child(2){flex:1.6}
.cols .l{font-size:10px;color:#8E8672;flex:none}
.cols .v{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.box{background:var(--card);border-radius:24px;padding:16px 18px;margin-top:14px}
.box h4{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.li .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--soft)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kv .l{font-size:11.5px;color:var(--muted)}.kv .v{font-size:15px;font-weight:700;margin-top:2px;word-break:break-word}
.note-y{background:#FFF3CF;border:1px solid #F2D27A;border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.6}
.note-r{background:#FCE9E5;border:1px solid #F1B9AE;border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.6;color:#8A2416}
.note-g{background:var(--lime);border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.6;color:#0A5134}
.empty{text-align:center;color:var(--muted);padding:44px 10px;font-size:14px}
.empty svg{width:40px;height:40px;stroke-width:1.4;margin-bottom:8px}
/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:14px 20px 4px}
.hdr .ttl{flex:1;min-width:0;text-align:center;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{width:40px;flex:none}
.ptitle{font-size:26px;font-weight:800;letter-spacing:-.5px}
/* forms */
.fld{margin-top:14px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--card);color:var(--ink);border:1.5px solid transparent;border-radius:16px;padding:13px 15px;font-size:15px;outline:none}
.inp:focus{border-color:var(--green)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.inp{min-height:76px;resize:vertical}
.qty{display:inline-flex;align-items:center;background:var(--soft);border-radius:20px;overflow:hidden;flex:none}
.qty button{width:32px;height:32px;font-size:18px;font-weight:700}
.qty input{width:52px;text-align:center;border:0;background:none;font-weight:800;font-size:15px;outline:none;padding:6px 0}
.bigbtn{flex:1;background:var(--green);color:#fff;border-radius:40px;height:54px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;padding:0 14px;min-width:0}
.bigbtn.dark{background:#161616}.bigbtn.ghost{background:var(--card);color:#161616}.bigbtn.red{background:var(--red)}.bigbtn.gold{background:var(--gold);color:#161616}
.bigbtn:disabled{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;background:#161616;color:#fff;flex:none}
.pill.g{background:var(--green)}.pill.w{background:var(--card);color:#161616}
.bbar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px calc(18px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -10px 20px -12px rgba(0,0,0,.18);display:flex;gap:10px;z-index:20}
.total{display:flex;flex-direction:column;justify-content:center;flex:none;min-width:0}
.total .l{font-size:11px;color:var(--muted)}.total .v{font-size:19px;font-weight:800;white-space:nowrap}

.banner{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:55;background:#161616;color:#fff;border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(calc(-100% - 90px));transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:pointer}

.tl .ev:after{content:"";position:absolute;left:-13px;top:17px;bottom:-3px;width:2px;background:#E2DCCF}

.tl .ev.cur:before{background:var(--green);box-shadow:0 0 0 4px var(--lime)}

.steps{display:flex;align-items:flex-start;margin-top:12px}

/* scanner */

.rank .meter{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:4px}
.rank .meter i{display:block;height:100%;background:var(--green);border-radius:4px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111;flex:none;font-size:16px;background:var(--gold)}

.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}

/* ================= 数据层：本机数据库 + 待提交队列（离线可用） + 云端同步 ================= */
const KINDS=['settings','wh','products','partners','moves','po','grn','pr','so','sr','counts','ships','svc','fin','users'];
const DB={
  d:{},outbox:[],seq:0,lastSync:0,ver:0,cloud:!!(CFG.supabaseUrl&&CFG.supabaseAnonKey),
  load(){const s=LS.get('db',null);KINDS.forEach(k=>this.d[k]=(s&&s[k])||[]);this.outbox=LS.get('outbox',[]);this.seq=LS.get('seq',0);this.lastSync=LS.get('lastSync',0);this.ver++},
  save(){const o={};KINDS.forEach(k=>o[k]=this.d[k]);LS.set('db',o);LS.set('outbox',this.outbox);LS.set('seq',this.seq);LS.set('lastSync',this.lastSync)},
  all(k){return (this.d[k]||[]).filter(x=>!x.del)},
  get(k,id){return (this.d[k]||[]).find(x=>x.id===id)},
  /* 写入一条记录：本机立即生效，进入待提交队列；联网后自动提交到云端 */
  put(k,doc,opt={}){doc={...doc};if(!doc.id)doc.id=uid(k.slice(0,2));doc.u=Date.now();doc.by=doc.by||(S.me&&S.me.id)||'';
    const a=this.d[k]||(this.d[k]=[]);const i=a.findIndex(x=>x.id===doc.id);if(i>=0)a[i]=doc;else a.push(doc);
    if(!opt.local){this.outbox.push({k,id:doc.id,d:doc});doc._q=1}
    this.ver++;this.save();if(!opt.quiet){bc('chg',[{k,d:doc}]);setTimeout(()=>Sync.run(),50)}return doc},
  merge(rows){let n=0;rows.forEach(r=>{const a=this.d[r.k]||(this.d[r.k]=[]);const i=a.findIndex(x=>x.id===r.d.id);
      if(i>=0){if(a[i]._q&&this.outbox.some(o=>o.k===r.k&&o.id===r.d.id))return;if((a[i].u||0)>(r.d.u||0)&&!r.force)return;a[i]=r.d}else a.push(r.d);n++});
    if(n){this.ver++;this.save()}return n}
};
/* 同一台设备多个窗口之间实时同步（演示多人协作，也让手机桌面版与浏览器版保持一致） */
let BC=null;try{BC=new BroadcastChannel('jxc')}catch(e){}
function bc(type,rows){try{BC&&BC.postMessage({type,rows})}catch(e){}}
if(BC)BC.onmessage=e=>{const m=e.data||{};if(m.type==='chg'){const rows=(m.rows||[]).map(r=>({k:r.k,d:{...r.d,_q:0},force:true}));DB.merge(rows);onRemote(rows)}
  else if(m.type==='reset'){DB.load();if(window.render)render(false)}};
function onRemote(rows){try{typeof Alerts!=='undefined'&&Alerts.scan(rows)}catch(e){console.error(e)}if(window.softRender)softRender()}

/* 云端（Supabase）：所有读写都走 RPC 函数，便于权限控制（与 ChinaPaw 相同的安全原则） */
async function rpc(fn,args){const r=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',
   headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const tx=await r.text();if(!r.ok){let m=tx;try{m=JSON.parse(tx).message||tx}catch(e){}throw new Error(m)}return tx?JSON.parse(tx):null}
const Sync={timer:null,
  async run(force){
    if(S.syncing)return;if(!navigator.onLine){S.online=false;window.syncUI&&syncUI();return}
    S.syncing=true;window.syncUI&&syncUI();const v0=DB.ver;
    try{
      if(DB.cloud&&S.token){
        for(let b=0;DB.outbox.length&&b<25;b++){const ops=DB.outbox.slice(0,200).map(o=>({k:o.k,id:o.id,d:{...o.d,_q:undefined}}));
          const r=await rpc('jxc_push',{p_token:S.token,p_ops:ops});
          DB.outbox.splice(0,ops.length);ops.forEach(o=>{const x=DB.get(o.k,o.id);if(x&&!DB.outbox.some(q=>q.k===o.k&&q.id===o.id))delete x._q});
          if(r&&r.rejected&&r.rejected.length){const rj=new Set(r.rejected);ops.filter(o=>rj.has(o.id)).forEach(o=>{DB.d[o.k]=(DB.d[o.k]||[]).filter(x=>x.id!==o.id)});DB.seq=0;DB.ver++}
          if(r&&r.rejected&&r.rejected.length)toast(L('有 ','')+r.rejected.length+L(' 条记录无权限，未提交',' change(s) rejected (no permission)'))}
        const p=await rpc('jxc_pull',{p_token:S.token,p_since:DB.seq});
        if(p){const rows=(p.rows||[]).map(r=>({k:r.k,d:r.d,force:true}));const mine=new Set(DB.outbox.map(o=>o.k+o.id));
          const fresh=rows.filter(r=>!mine.has(r.k+r.d.id));DB.merge(fresh);DB.seq=p.seq||DB.seq;
          if(p.users)DB.d.users=p.users;if(fresh.length&&(force!=='boot'))onRemote(fresh.filter(r=>r.d.by!==S.me.id))}
      }else{
        /* 本机演示模式：联网时把暂存的单据“提交”（清空队列） */
        if(DB.outbox.length){const ks=new Set(DB.outbox.map(o=>o.k+o.id));DB.outbox=[];(KINDS).forEach(k=>DB.d[k].forEach(x=>{if(ks.has(k+x.id))delete x._q}))}
      }
      DB.lastSync=Date.now();DB.save();S.online=true;S.syncErr='';
    }catch(e){console.error(e);S.syncErr=String(e.message||e);if(force===true)toast(L('同步失败：','Sync failed: ')+S.syncErr)}
    finally{S.syncing=false;window.syncUI&&syncUI();if(force===true&&!S.syncErr)toast(L('已同步','Synced'));
      /* 只有数据真的变了才刷新画面（原来每次后台同步都整页重画，造成闪动） */
      if(DB.ver!==v0&&window.softRender)softRender()}},
  start(){clearInterval(this.timer);const tick=()=>{if(document.visibilityState==='visible')this.run()};
    this.timer=setInterval(tick,DB.cloud?8000:20000);
    addEventListener('online',()=>{S.online=true;toast(L('网络已恢复，正在自动提交','Back online, submitting…'));this.run();window.syncUI&&syncUI();window.render&&render(false)});
    addEventListener('offline',()=>{S.online=false;window.syncUI&&syncUI();window.render&&render(false)});
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')this.run()})}
};

/* ---------- 库存引擎：库存 = 全部出入库流水之和（离线、多人同时操作都不会算错） ---------- */
let _sm=null,_smv=-1;
function stockMap(){if(_smv===DB.ver&&_sm)return _sm;const m={};
  DB.all('moves').forEach(v=>{const p=m[v.pid]||(m[v.pid]={q:0,w:{}});p.q+=v.qty;const w=p.w[v.wh]||(p.w[v.wh]={q:0,b:{}});w.q+=v.qty;
    const bk=v.batch||'-';const b=w.b[bk]||(w.b[bk]={q:0,exp:v.exp||'',batch:v.batch||''});b.q+=v.qty;if(v.exp&&!b.exp)b.exp=v.exp});
  _sm=m;_smv=DB.ver;return m}
const qtyOf=(pid,wh)=>{const p=stockMap()[pid];if(!p)return 0;return wh?((p.w[wh]||{}).q||0):p.q};
function batchesOf(pid,wh){const p=stockMap()[pid];if(!p)return [];const out=[];Object.entries(p.w).forEach(([w,x])=>{if(wh&&w!==wh)return;
  Object.values(x.b).forEach(b=>{if(Math.abs(b.q)>1e-9)out.push({...b,wh:w})})});return out.sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999'))}
function stStatus(p,q){if(q==null)q=qtyOf(p.id);if(q<=0)return 'out';if(q<=(+p.min||0))return 'low';if(p.max&&q>=+p.max)return 'over';return 'ok'}

/* 先到期先出（FEFO）分配批次 */
function allocate(pid,wh,qty){const bs=batchesOf(pid,wh).filter(b=>b.q>0);const r=[];let left=qty;
  for(const b of bs){if(left<=0)break;const take=Math.min(b.q,left);r.push({batch:b.batch,exp:b.exp,qty:take});left-=take}
  if(left>1e-9)return null;return r}

/* ---------- 上传：图片压缩 + 上传到云端存储（去重、失败自动重试；与 ChinaPaw upImg 相同） ---------- */
function resizeImg(f,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)})}
function pickImage(max,cb,capture){const i=document.createElement('input');i.type='file';i.accept='image/*';if(capture)i.capture='environment';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;const du=await resizeImg(f,max||1000);cb(await upImg(du))};i.click()}
async function sha1(u8){const h=await crypto.subtle.digest('SHA-1',u8);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
const upCache=LS.get('mediaUp',{});
async function upImg(du){
  if(!DB.cloud||typeof du!=='string'||!du.startsWith('data:image/'))return du;
  const m=/^data:(image\/(jpeg|jpg|png|webp));base64,([\s\S]*)$/.exec(du);if(!m)return du;
  try{const bin=atob(m[3]);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const h=await sha1(u8);if(upCache[h])return upCache[h];const ext=m[2]==='png'?'png':'jpg',type=ext==='jpg'?'image/jpeg':'image/png';
    const name='jxc/'+h.slice(0,2)+'/'+h+'.'+ext;const BASE=CFG.supabaseUrl.replace(/\/$/,'');let ok=false;
    for(let a=0;a<4&&!ok;a++){if(a)await new Promise(z=>setTimeout(z,[0,800,2000,4500][a]));
      try{const r=await fetch(BASE+'/storage/v1/object/media/'+name,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey,'Content-Type':type,'cache-control':'max-age=31536000','x-upsert':'false'},body:new Blob([u8],{type})});
        if(r.ok){ok=true;break}const t=await r.text().catch(()=>'');if(/Duplicate|already exists/i.test(t)){ok=true;break}if(r.status<500&&r.status!==429)break}catch(e){}}
    if(!ok)return du;const url=BASE+'/storage/v1/object/public/media/'+name;upCache[h]=url;LS.set('mediaUp',upCache);return url}catch(e){return du}}

async function downloadFile(name,text,type){const blob=new Blob(['﻿'+text],{type:type||'text/csv;charset=utf-8'});
  try{if(isNative()&&navigator.canShare){const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(L('已开始下载：','Downloading: ')+name)}
const csv=rows=>rows.map(r=>r.map(c=>{c=c==null?'':String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n');
/* ---------- 导出 Excel（.xlsx）：带边框、表头底色、列宽，打开即可打印 ---------- */
const _CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=_CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipBlob(files,type){const enc=new TextEncoder();const parts=[],cd=[];let off=0;

async function downloadBlob(name,blob){

/* ---------- 账号：只用密码登录（不需要手机号）。密码在全公司唯一，系统据此识别是哪个部门的哪个账号 ---------- */
async function pwHash(id,pw){const b=new TextEncoder().encode('jxc|'+id+'|'+pw);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function findByPw(pw,exceptId){for(const u of DB.all('users')){if(u.id!==exceptId&&u.pw===await pwHash(u.id,pw))return u}return null}
async function login(pw,trust){pw=String(pw||'').trim();const lk=LS.get('lock',{n:0,until:0});
  if(lk.until>Date.now())throw new Error(L(`尝试次数过多，请 ${Math.ceil((lk.until-Date.now())/1000)} 秒后再试`,`Too many attempts. Try again in ${Math.ceil((lk.until-Date.now())/1000)}s`));
  try{if(DB.cloud){const r=await rpc('jxc_login',{p_pw:pw,p_device:(LS.get('dev',null)||(LS.set('dev',uid('d')),LS.get('dev','')))+' '+navigator.userAgent.slice(0,90)});if(!r||!r.token)throw new Error(r&&r.error?r.error.split(' / ')[S.lang==='zh'?0:1]||r.error:'');S.token=r.token;S.me=r.user}
    else{const u=await findByPw(pw);if(!u||u.active===false)throw 0;S.me={...u};delete S.me.pw}}
  catch(e){lk.n++;if(lk.n>=5){lk.until=Date.now()+60e3;lk.n=0}LS.set('lock',lk);throw new Error(e&&e.message&&DB.cloud?e.message:L('密码错误或账号已停用','Wrong password or account disabled'))}
  LS.set('lock',{n:0,until:0});LS.set(SK,{me:S.me,token:S.token||null,trust:!!trust,t:Date.now()})}
function restoreSession(){const s=LS.get(SK,null);if(!s||!s.trust)return false;if(Date.now()-s.t>30*864e5)return false;S.me=s.me;S.token=s.token;
  if(!DB.cloud){const u=DB.get('users',S.me.id);if(!u||u.active===false)return false;S.me={...u};delete S.me.pw}return true}
function logout(){if(DB.cloud&&S.token)rpc('jxc_logout',{p_token:S.token}).catch(()=>{});LS.del(SK);S.me=null;S.token=null}
async function changePw(old,nw){if(DB.cloud){await rpc('jxc_change_pw',{p_token:S.token,p_old:old,p_new:nw});return}
  const u=DB.get('users',S.me.id);if(u.pw!==await pwHash(u.id,old))throw new Error(L('原密码不正确','Current password is wrong'));

/* ---------- 版本更新（与 ChinaPaw 相同：读取 version.json，网页版一键刷新，安装包版在 App 内下载安装） ---------- */

async function checkUpdate(manual){if(UPD.busy)return;UPD.busy=true;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const v=await r.json();UPD.remote=v;
    const nb=isNative()?await nativeBuild():0;
    if(isNative()&&v.minNative&&nb&&nb<v.minNative){showUpd(v,'apk');return}
    if((+v.build||0)>APP_BUILD){if(!manual&&!v.force){const d=LS.get('updLater',null);if(d&&d.b===v.build&&Date.now()-d.t<2*3600e3)return}showUpd(v,'web');return}
    if(manual)toast(L('已是最新版本','You have the latest version')+' · v'+APP_VER)}
  catch(e){if(manual)toast(L('检查更新失败，请检查网络','Update check failed, check your network'))}
  finally{UPD.busy=false;window.syncUI&&syncUI()}}
function showUpd(v,kind){const force=!!v.force||kind==='apk'&&v.forceNative;

   <div class="sm muted">v${APP_VER} → <b style="color:var(--ink)">v${esc(v.version)}</b>${v.date?' · '+esc(v.date):''}</div></div></div>${updNotes(v)}
   ${kind==='apk'?`<div class="note-y" style="margin-top:14px">${L('这次更新需要安装新的安装包，下载后点“安装”即可，数据不会丢失。','This update needs a new app package. Download and tap Install — your data stays.')}</div>`:''}

/* 安卓 App：用内置下载器下载新安装包（显示进度），然后调起系统安装 */
const UPX={st:'idle',pct:0,done:0,total:0};let _updL=null;

  else body=`<div class="note-r" style="margin-top:14px">${esc(UPX.err||'')}</div><div class="row gap" style="margin-top:16px"><button class="bigbtn ghost" onclick="updBrowser()">${L('用浏览器下载','Use browser')}</button><button class="bigbtn" onclick="doApk()">${L('重试','Retry')}</button></div>`;
  openSheet(head+body,s==='dl')}
function updProg(){const b=$('#updBar');if(!b)return;b.style.width=Math.max(3,UPX.pct)+'%';$('#updPct').textContent=UPX.pct>=0?UPX.pct+'%':'';$('#updSz').textContent=UPX.total?mb(UPX.done)+' / '+mb(UPX.total):''}

function updCancel(){UPX.st='idle';try{window.Capacitor.Plugins.AppUpdater.cancel()}catch(e){}closeSheet(true)}

try{window.Capacitor&&window.Capacitor.Plugins.App&&window.Capacitor.Plugins.App.addListener('resume',async()=>{if(!UPX.wait||!hasUpdater())return;

</script>
<script>
/* ================= 华宝进销存 · 用户端（移动端） ================= */
const V={};
const WEB=document.body.classList.contains('web'),ADMIN=document.body.classList.contains('admin');const LOGO=window.LOGO_DATA||'logo.svg';
/* 每个页面需要的权限：没有权限直接回首页，部门之间不能越界 */
const NEED={docs:'_docs',stock:'stock',product:'stock',po_new:'po',recv_pick:'po_recv',recv:'po_recv',pr_new:'pr',sr_new:'sr',so_new:'so',take:'take',fin:'fin',report:'report',logi:'logi',ship_view:'logi',ship_new:'logi',logi_svc:'logi',
  mgmt:'*',m_users:'*',m_stores:'*',m_products:'*',m_partners:'*',m_settings:'*',m_backup:'*',m_log:'*'};
const LIVE=new Set(['home','stock','product','docs','po_view','so_view','take_view','logi','ship_view','report','msgs','me','recv_pick','fin','mgmt','m_users','m_stores','m_products','m_log']);
const whName=id=>nm((DB.get('wh',id)||{}).n)||id||'';
const ptName=id=>nmP((DB.get('partners',id)||{}).n)||'—';
const P_=id=>DB.get('products',id)||{n:{zh:'已删除商品',en:'Deleted item'},unit:{zh:'',en:''}};
const pName=id=>nm(P_(id).n);
const unit=p=>nm(p.unit);
const userName=id=>{const u=DB.get('users',id);return u?nmP(u.name):(S.me&&S.me.id===id?nmP(S.me.name):'—')};
const thumb=(p,sz)=>`<div class="thumb"${sz?` style="width:${sz}px;height:${sz}px"`:''}>${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(nm(p.n).replace(/[^\p{L}\p{N}]/gu,'').slice(0,1))}</div>`;
const myWh=()=>(S.me&&S.me.wh)||'W1';
function hdr(title,right){return `<div class="hdr"><button class="icbtn" onclick="back()" aria-label="back">${ic('back')}</button><div class="ttl">${title}</div>${right||'<span class="sp"></span>'}</div>`}
function emptyBox(icon,txt){return `<div class="empty">${ic(icon)}<div>${txt}</div></div>`}
function sw(on,fn){return `<button class="sw ${on?'on':''}" onclick="${fn}" aria-label="switch"></button>`}

/* ---------- 导航（与 ChinaPaw 相同：历史栈 + 返回恢复滚动位置） ---------- */
function go(v,p={}){S.hist.push({view:S.view,params:S.params,top:$('#screen').scrollTop});S.view=v;S.params=p;render(true)}
function back(){if(sheetOn())return closeSheet();const p=S.hist.pop();if(!p)return tab('home');S.view=p.view;S.params=p.params;render(false);$('#screen').scrollTop=p.top||0}
function tab(v){S.hist=[];S.view=v;S.params={};render(true)}
function replace(v,p={}){S.view=v;S.params=p;render(true)}
/* 保存后跳到单据详情：如果上一页就是这张单据，就不重复入栈 */
function finish(v,p){const t=S.hist[S.hist.length-1];if(t&&t.view===v&&t.params&&t.params.id===p.id)S.hist.pop();replace(v,p)}
function render(top,soft){
  if(!S.me&&S.view!=='login')S.view='login';
  if(!S.me&&sheetOn())closeSheet(true);
  if(S.me&&V[S.view]&&NEED[S.view]&&!can(NEED[S.view])){S.view='home';S.hist=[]}
  const sc=$('#screen');let h='';try{h=(V[S.view]||V.home)()}catch(e){console.error(e);h=`<div class="pad"><div class="note-r">${esc(e.message)}</div></div>`}
  /* soft = 后台数据更新后的刷新：不播放淡入动画、保持滚动位置（避免闪动） */
  sc.innerHTML=`<div class="${soft?'':'fade'}">${S.me?topBars():''}${h}</div>`;S.rv=DB.ver;
  const fx=$('#fixed');fx.innerHTML='';sc.querySelectorAll('.bbar').forEach(e=>fx.appendChild(e));
  const isTab=TABS().some(t=>t[0]===S.view)&&!!S.me;sc.classList.toggle('nonav',!isTab);
  $('#navwrap').innerHTML=S.me&&(isTab||WEB)?tnav():'';document.body.classList.toggle('authed',!!S.me);
  if(top)sc.scrollTop=0;
  syncUI();try{pwaBar()}catch(e){}fitText();
}
/* 标题一律一行：放不下时先缩小字号（最多到 65%），仍放不下才用省略号（与 ChinaPaw v4.3.2 相同） */
function fitText(){$$('#screen .hero,#screen .sc .t,#screen .stat .n,#screen .wtile .b,#screen .fit,#screen .ptitle').forEach(e=>{e.style.fontSize='';const cs=parseFloat(getComputedStyle(e).fontSize);let f=cs,i=0;
  e.style.whiteSpace='nowrap';e.style.overflow='hidden';while(e.scrollWidth>e.clientWidth+1&&f>cs*.65&&i<40){f-=.5;e.style.fontSize=f+'px';i++}})}
addEventListener('resize',()=>{clearTimeout(window._fz);window._fz=setTimeout(fitText,150)});
let _soft=0;
/* 后台刷新：只有数据真的变化（或翻译、汇率更新）时才重画；正在输入或打开弹层时不打断 */
function softRender(force){if(!S.me&&!(force&&S.view==='login'))return;if(!force&&S.rv===DB.ver)return;const a=document.activeElement;
  if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#screen').contains(a))return;if(sheetOn()||!(LIVE.has(S.view)||S.view==='login'))return;
  clearTimeout(_soft);_soft=setTimeout(()=>{const t=$('#screen').scrollTop;render(false,true);$('#screen').scrollTop=t},120)}
function todoCount(){let n=0;
  if(can('so_ship'))n+=DB.all('so').filter(s=>s.status==='submitted').length;
  if(can('po_recv'))n+=DB.all('po').filter(p=>p.status==='ordered').length;
  if(S.me&&S.me.role==='gm')n+=DB.all('counts').filter(c=>c.status==='pending').length;
  if(can('pr_exec'))n+=DB.all('pr').filter(r=>r.status==='pending').length;if(can('sr_exec'))n+=DB.all('sr').filter(r=>r.status==='pending').length;return n}
/* 底部导航：按部门显示各自的功能（网页版显示在左侧） */
function TABS(){const t=[['home','home',L('首页','Home')]];
  if(can('stock'))t.push(['stock','box',L('库存','Stock')]);
  if(can('po')||can('so')||can('po_recv')||can('so_ship')||can('take'))t.push(['docs','doc',L('单据','Orders')]);
  if(can('fin'))t.push(['fin','calc',L('财务','Finance')]);
  if(can('logi'))t.push(['logi','truck',L('物流','Logistics')]);
  t.push(['me','user',L('我的','Me')]);return t}
function tnav(){const v=S.view;const b=n=>n?`<span class="cnt">${n>99?'99+':n}</span>`:'';
  const cnt={docs:todoCount(),fin:finTodo(),logi:DB.all('ships').filter(s=>s.status==='exception').length,me:Alerts.unread()};
  let h=TABS().map(([k,icon,label])=>`<button class="${v===k?'on':''}" onclick="tab('${k}')" aria-label="${esc(label)}"><span class="ti">${ic(icon,22)}${b(cnt[k])}</span><span class="tl">${label}</span></button>`).join('');
  if(WEB){h=`<div class="wbrand"><img class="logo" src="${LOGO}" alt=""><b class="one">${BRAND()}</b></div>`+h+
    [can('report')?['report','chart',L('简易报表','Reports')]:null,['msgs','bell',L('消息','Messages')],S.me.role==='gm'?['mgmt','gear',L('后台管理','Management')]:null].filter(Boolean).map(([k,icon,label])=>`<button class="${v===k||(k==='mgmt'&&v.startsWith('m_'))?'on':''}" onclick="tab('${k}')"><span class="ti">${ic(icon,22)}${k==='msgs'?b(Alerts.unread()):''}</span><span class="tl">${label}</span></button>`).join('')+
    `<div class="wfoot"><div class="row gap6">${ctryBtn()}${langBtn()}${curBtn()}</div><div class="xs" style="margin-top:8px;opacity:.7">${esc(nmP(S.me.name))} · ${roleName(S.me.role)}</div></div>`}
  return `<nav class="tnav">${h}</nav>`}
function topBars(){let h='';
  if(!S.online)h+=`<div class="offbar">${ic('cloud',16)} ${L('网络未连接：可查看已缓存数据，开单会暂存本机，联网后自动提交','Offline: cached data available. New orders are saved on this phone and submitted when back online')}</div>`;
  else if(hasUpd())h+=`<div class="updbar" onclick="showUpd(UPD.remote,'web')">${ic('download',16)} ${L('有新版本','New version')} v${esc(UPD.remote.version)} · ${L('点此更新','tap to update')}</div>`;
  return h}
function syncUI(){const c=$('#syncChip');if(!c)return;const n=DB.outbox.length;
  c.className='syncchip'+(!S.online?' off':S.syncing?' busy':'');
  c.innerHTML=`<i></i>${!S.online?L('离线','Offline')+(n?' · '+n:''):S.syncing?L('同步中','Syncing'):n?n+L(' 待提交',' pending'):DB.cloud?L('已同步','Synced'):L('本机','Local')}`}
function syncSheet(){const n=DB.outbox.length;
  openSheet(`<div class="sh">${L('数据同步','Data sync')}</div>
   <div class="kv" style="margin-top:12px"><div><div class="l">${L('模式','Mode')}</div><div class="v">${DB.cloud?L('云端实时同步','Cloud real-time'):L('本机演示模式','Local demo mode')}</div></div>
   <div><div class="l">${L('网络','Network')}</div><div class="v ${S.online?'green':'red'}">${S.online?L('在线','Online'):L('离线','Offline')}</div></div>
   <div><div class="l">${L('最后同步','Last sync')}</div><div class="v">${DB.lastSync?fdate(DB.lastSync):'—'}</div></div>
   <div><div class="l">${L('待提交','Pending')}</div><div class="v">${n} ${L('条','item(s)')}</div></div></div>
   ${S.syncErr?`<div class="note-r" style="margin-top:12px">${esc(S.syncErr)}</div>`:''}
   <div class="note-g" style="margin-top:14px">${DB.cloud?L('新订单、库存变动每隔几秒自动刷新，不用手动下拉；断网时开单暂存本机，联网后自动提交。','New orders and stock changes refresh automatically every few seconds. Offline orders are saved here and submitted when back online.'):L('当前未连接云端：数据保存在本机，多个窗口之间实时同步。在 config.js 填写云端地址后即可多人共用。','Not connected to the cloud: data stays on this device and syncs live between windows. Fill in config.js to share with your team.')}</div>
   <button class="bigbtn" style="width:100%;margin-top:16px" onclick="closeSheet();Sync.run(true)">${ic('refresh')} ${L('立即同步','Sync now')}</button>`)}

/* ================= 消息提醒 ================= */
const pnL=(id,l)=>{const n=(DB.get('partners',id)||{}).n;return n&&typeof n==='object'?(n[l]||n.zh||n.en):(n||'')};
const prL=(p,l)=>p&&typeof p.n==='object'?(p.n[l]||p.n.zh||p.n.en):((p&&p.n)||'');
const unL=(p,l)=>p&&typeof p.unit==='object'?(p.unit[l]||''):((p&&p.unit)||'');
const Alerts={
  key(){return 'notes_'+(S.me?S.me.id:'x')},
  list(){return LS.get(this.key(),[])},save(a){LS.set(this.key(),a.slice(0,80))},
  unread(){return S.me?this.list().filter(n=>!n.read).length:0},
  prefs(){return Object.assign({order:true,low:true,ship:true,logi:true,fin:true},LS.get('prefs_'+(S.me&&S.me.id),{}))},
  add(n,show,t){const a=this.list();if(n.key&&a.some(x=>x.key===n.key))return;n.id=uid('n');n.t=n.t||Date.now();a.unshift(n);this.save(a);if(show)banner(n)},
  scan(rows,show=true){if(!S.me)return;const pf=this.prefs();
    rows.forEach(({k,d})=>{if(d.by===S.me.id)return;const _add=this.add.bind(this);const self={add:(n,s)=>{n.t=show?Date.now():(d.u||d.t);_add(n,s)}};
      if(k==='so'&&d.status==='submitted'&&can('so_ship')&&pf.order)self.add({key:'so'+d.id+'s',ic:'cart',c:'var(--gold)',zh:`新订单 ${d.no} 待出库 · ${pnL(d.cus,'zh')}`,en:`New order ${d.no} to ship · ${pnL(d.cus,'en')}`,go:['so_view',{id:d.id}]},show);
      if(k==='so'&&d.status==='submitted'&&!can('so_ship')&&can('so')&&pf.order)self.add({key:'so'+d.id+'n',ic:'cart',c:'var(--gold)',zh:`同事提交了销售单 ${d.no}`,en:`Sales order ${d.no} submitted`,go:['so_view',{id:d.id}]},show);
      if(k==='so'&&d.status==='shipped'&&can('so')&&pf.ship)self.add({key:'so'+d.id+'x',ic:'out',c:'var(--blue)',zh:`销售单 ${d.no} 已出库发货`,en:`Order ${d.no} has shipped`,go:['so_view',{id:d.id}]},show);
      if(k==='po'&&d.status==='ordered'&&can('po_recv')&&pf.ship)self.add({key:'po'+d.id+'o',ic:'in',c:'var(--green)',zh:`采购单 ${d.no} 已下单，到货后请入库`,en:`PO ${d.no} ordered — receive on arrival`,go:['po_view',{id:d.id}]},show);
      if(k==='counts'&&d.status==='pending'&&S.me.role==='gm')self.add({key:'tk'+d.id,ic:'clip',c:'var(--purple)',zh:`盘点单 ${d.no} 待审核`,en:`Stock count ${d.no} awaiting review`,go:['take_view',{id:d.id}]},show);
      if(k==='counts'&&d.status!=='pending'&&d.by===S.me.id)self.add({key:'tk'+d.id+d.status,ic:'clip',c:'var(--purple)',zh:`盘点单 ${d.no} ${d.status==='approved'?'已审核通过':'被驳回'}`,en:`Stock count ${d.no} ${d.status}`,go:['take_view',{id:d.id}]},show);
      if(k==='ships'&&pf.logi&&can('logi'))self.add({key:'sh'+d.id+d.status,ic:'truck',c:d.status==='exception'?'var(--red)':'var(--blue)',zh:`物流 ${d.trackNo||d.no}：${SH_ST[d.status][0]}`,en:`Shipment ${d.trackNo||d.no}: ${SH_ST[d.status][1]}`,go:['ship_view',{id:d.id}]},show);
      if(k==='pr'&&d.status==='pending'&&can('pr_exec'))self.add({key:'pr'+d.id,ic:'out',c:'var(--orange)',zh:`采购退货 ${d.no} 待出库`,en:`Supplier return ${d.no} to ship out`,go:['docs',{}]},show);
      if(k==='sr'&&d.status==='pending'&&can('sr_exec'))self.add({key:'sr'+d.id,ic:'in',c:'var(--purple)',zh:`销售退货 ${d.no} 待收货`,en:`Customer return ${d.no} to receive`,go:['docs',{}]},show);
      if(k==='fin'&&d.type==='rcv'&&d.status==='recorded'&&can('fin_verify')&&S.me.role!=='gm'&&pf.fin)self.add({key:'fr'+d.id,ic:'check',c:'var(--purple)',zh:`出纳登记了一笔收款，待核对`,en:`A receipt was recorded — please verify`,go:['fin',{}]},show);
      if(k==='fin'&&d.type==='pay'&&d.status==='approved'&&can('fin_pay')&&S.me.role!=='gm'&&pf.fin)self.add({key:'fp'+d.id,ic:'out',c:'var(--orange)',zh:`会计审批了一笔付款，待支付`,en:`A payment was approved — please pay`,go:['fin',{}]},show);
      if(k==='svc'&&d.status==='new'&&S.me.role==='gm')self.add({key:'bk'+d.id,ic:'calendar',c:'var(--orange)',zh:`新的物流预约 ${d.no}`,en:`New logistics booking ${d.no}`,go:['logi_svc',{}]},show);
    });
    if(rows.some(r=>r.k==='moves'))this.low(show)},
  low(show){if(!S.me||!this.prefs().low||!(can('po')||can('take')))return;const day=fday(Date.now());
    DB.all('products').forEach(p=>{const q=qtyOf(p.id);const s=stStatus(p,q);if(s==='low'||s==='out')this.add({key:'low'+p.id+day,ic:'alert',c:'var(--red)',zh:`库存不足：${prL(p,'zh')} 仅剩 ${n2(q)} ${unL(p,'zh')}`,en:`Low stock: ${prL(p,'en')} — ${n2(q)} ${unL(p,'en')} left`,go:['product',{id:p.id}]},show)})},
  first(){if(LS.get('notesInit_'+S.me.id,0))return;const rows=[];KINDS.forEach(k=>DB.all(k).forEach(d=>rows.push({k,d})));this.scan(rows.filter(r=>r.k!=='ships'||r.d.status==='exception'||r.d.status==='delivering'),false);LS.set('notesInit_'+S.me.id,1)}
};
function banner(n){const b=$('#banner');if(!b)return;b.innerHTML=`<div class="qi" style="background:${n.c||'var(--gold)'};color:#fff">${ic(n.ic||'bell',18)}</div><div style="flex:1;min-width:0"><div class="b sm">${L('新消息','New')}</div><div class="sm one">${esc(L(n.zh,n.en))}</div></div>`;
  b.onclick=()=>{b.classList.remove('on');markRead(n.id);if(n.go)go(n.go[0],n.go[1])};b.classList.add('on');try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
  clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove('on'),4500)}
function markRead(id){const a=Alerts.list();a.forEach(n=>{if(!id||n.id===id)n.read=true});Alerts.save(a)}

/* ================= 登录：只输入密码（不需要手机号），系统按密码识别部门与账号 ================= */
V.login=()=>{const demo=!DB.cloud;
  return `<div class="login-hero"><div class="row between"><div class="row gap6" style="min-width:0"><img class="logo" src="${LOGO}" alt=""><b style="font-size:18px" class="one">${BRAND()}</b></div><div class="row" style="gap:8px">${ctryBtn()}${langBtn()}</div></div>
   <div class="fit" style="font-size:30px;font-weight:800;margin-top:26px;letter-spacing:-.5px;white-space:nowrap">${L('进销存，<span class="hl" style="background:var(--gold);color:#161616;padding:0 8px;border-radius:12px;display:inline-block;transform:rotate(-2deg)">很简单</span>！','Stock, <span style="background:var(--gold);color:#161616;padding:0 8px;border-radius:12px;display:inline-block;transform:rotate(-2deg)">simple</span>!')}</div>
   <div class="fit" style="opacity:.85;margin-top:6px;font-size:13px;font-weight:600;letter-spacing:1px;white-space:nowrap">${L('非洲 54 国通用 · 各部门各司其职','For all 54 African countries · every department in its lane')}</div></div>
  <div class="pad" style="padding-top:20px">
   <div class="fld"><label>${L('输入密码登录','Sign in with your password')}</label><div class="row" style="position:relative"><input class="inp" id="lgPw" type="password" inputmode="text" autocomplete="current-password" style="font-size:20px;letter-spacing:3px;text-align:center" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"><button style="position:absolute;right:12px;color:var(--muted)" onclick="const i=$('#lgPw');i.type=i.type==='password'?'text':'password'" aria-label="show">${ic('lock',18)}</button></div></div>
   <div class="row between" style="margin-top:14px"><span class="sm b">${L('自动登录（信任此设备）','Stay signed in (trust this device)')}</span>${sw(LS.get('trust',true),"LS.set('trust',!LS.get('trust',true));render(false)")}</div>
   <div id="lgErr" class="sm red" style="margin-top:10px;min-height:18px"></div>
   <button class="bigbtn" style="width:100%" onclick="doLogin()">${L('登录','Sign in')}</button>
   <div class="box"><h4>${L('各部门初始密码','Department starting passwords')}</h4>${ROLE_ORDER.map(r=>`<div class="li" ${demo?`onclick="$('#lgPw').value='${ROLES[r].code}';doLogin()"`:'style="cursor:default"'}><span class="badge ${ROLES[r].c}" style="min-width:84px;justify-content:center">${roleName(r)}</span><b data-notr style="flex:1;letter-spacing:2px">${ROLES[r].code}</b>${demo?ic('chev',16):''}</div>`).join('')}
    <div class="xs muted" style="margin-top:8px;line-height:1.6">${L('首次登录后请到“我的 → 修改密码”改掉初始密码。同部门新增账号的初始密码为“部门代码-序号”，如 444444-1。','Change the starting password after first sign-in (Me → Change password). Extra accounts in a department start with “code-number”, e.g. 444444-1.')}</div></div>
   <div class="xs muted" style="text-align:center;margin-top:22px" data-notr>v${APP_VER} · build ${APP_BUILD} · ${flagE(S.country)} ${esc(C().iso)} · ${DB.cloud?'Cloud':'Local demo'}</div>
  </div>`};
async function doLogin(){const pw=$('#lgPw').value;const e=$('#lgErr');if(!pw){e.textContent=L('请输入密码','Enter your password');return}
  e.textContent='';try{await login(pw,LS.get('trust',true));afterLogin()}catch(x){e.textContent=x.message;$('#lgPw').select()}}
function afterLogin(){if(ADMIN&&S.me.role!=='gm'){logout();S.view='login';render(false);setTimeout(()=>{const e=$('#lgErr');if(e)e.textContent=L('后台只允许总经理登录','Only the general manager can sign in here')},50);return}
  S.hist=[];S.view=ADMIN?'mgmt':'home';Alerts.first();Alerts.low(false);render(true);Sync.run('boot');toast(L('欢迎，','Welcome, ')+nmP(S.me.name)+' · '+roleName(S.me.role),false)}
function doLogout(){openSheet(`<div class="sh">${L('退出登录？','Sign out?')}</div><div class="sm muted" style="margin-top:6px">${DB.outbox.length?L(`还有 ${DB.outbox.length} 条记录未提交，下次登录后继续提交。`,`${DB.outbox.length} change(s) not yet submitted; they will be sent next time you sign in.`):L('退出后需要重新输入密码登录。','You will need your password to sign in again.')}</div>
  <div class="row gap" style="margin-top:18px"><button class="bigbtn ghost" onclick="closeSheet()">${L('取消','Cancel')}</button><button class="bigbtn red" onclick="closeSheet();logout();S.view='login';render(true)">${L('退出','Sign out')}</button></div>`)}

/* ================= 首页 ================= */
function greet(){const h=new Date().getHours();return h<12?L('上午好','Good morning'):h<18?L('下午好','Good afternoon'):L('晚上好','Good evening')}
const bigCard=(bg,fg,icon,t,sub,fn)=>`<div class="sc" style="background:${bg};color:${fg}" onclick="${fn}"><div class="ic">${ic(icon,19)}</div><div style="flex:1;min-width:0"><div class="t">${t}</div><div class="roles">${sub}</div></div><div class="go">${ic('arrow',16)}</div></div>`;
const tile=(bg,icon,t,sub,fn)=>`<div class="wtile" style="background:${bg}" onclick="${fn}"><div class="wti">${ic(icon)}</div><div style="min-width:0"><div class="b">${t}</div><div class="wsub">${sub}</div></div></div>`;
const statT=(cls,val,label,fn,cur)=>`<div class="stat ${cls}" onclick="${fn||''}"><div class="n" data-notr>${cur?`<small style="font-size:11px;font-weight:700;opacity:.75">${esc(CUR())} </small>`:''}${val}</div><div class="l">${label}</div></div>`;
V.home=()=>{const me=S.me,r=me.role;const today=dayStart();
  const soT=DB.all('so').filter(s=>s.status!=='draft'&&s.status!=='cancel'&&s.t>=today);const sales=soT.reduce((a,s)=>a+docTotal(s),0);
  const toShip=DB.all('so').filter(s=>s.status==='submitted').length,toRecv=DB.all('po').filter(p=>p.status==='ordered').length;
  const low=DB.all('products').filter(p=>['low','out'].includes(stStatus(p))).length;
  const ships=DB.all('ships');const transit=ships.filter(s=>['picked','transit','customs'].includes(s.status)).length,deliv=ships.filter(s=>s.status==='delivering').length,exc=ships.filter(s=>s.status==='exception').length;
  const F=finSum();const big=[],tiles=[];let stats='';
  if(r==='gm'||r==='sales'){if(can('so'))big.push(bigCard('var(--gold)','#161616','cart',L('销售开单','New sale'),L('选客户 → 扫码加商品 → 自动算金额','Customer → scan items → auto total'),"go('so_new')"))}
  if(r==='buyer')big.push(bigCard('var(--green)','#fff','in',L('采购下单','New purchase'),L('选供应商 → 加商品 → 提交下单','Supplier → items → place order'),"go('po_new')"));
  if(r==='keeper'){big.push(bigCard('var(--green)','#fff','in',L('采购入库','Receive goods'),L('选订单 → 填数量 → 扫码核对','Pick PO → quantities → scan check'),"go('recv_pick')"));
    big.push(bigCard('var(--gold)','#161616','out',L('销售出库','Ship orders'),L(`${toShip} 张待出库 · 确认发货扣库存`,`${toShip} to ship · confirm & deduct`),"S.docSeg='so';S.docF='submitted';tab('docs')"))}
  if(r==='acct'){big.push(bigCard('var(--purple)','#fff','calc',L('财务对账','Accounts'),L('应收 · 应付 · 收款核对 · 付款审批','Receivables · payables · checks · approvals'),"S.finSeg='ar';tab('fin')"));
    big.push(bigCard('var(--green)','#fff','chart',L('利润报表','Profit report'),L('销售额 · 成本 · 毛利','Sales · cost · gross profit'),"go('report')"))}
  if(r==='cashier'){big.push(bigCard('var(--green)','#fff','in',L('登记收款','Record receipt'),L('现金 / 银行 / 手机钱包','Cash / bank / mobile money'),"S.finSeg='ar';tab('fin')"));
    big.push(bigCard('var(--orange)','#fff','out',L('执行付款','Make payments'),L(`${F.apprN} 笔已审批待付`,`${F.apprN} approved, waiting`),"S.finSeg='ap';tab('fin')"))}
  if(can('stock'))tiles.push(tile('var(--tile)','scan',L('扫码查货','Scan & check'),L('相机扫码 · 秒出库存','Camera scan · instant stock'),'scanLookup()'));
  if(can('take'))tiles.push(tile('var(--blue)','clip',L('库存盘点','Stock count'),L('录实盘数 · 待审核','Enter counts · for review'),"go('take')"));
  if(r==='buyer')tiles.push(tile('var(--blue)','ret',L('采购退货','Return to supplier'),L('提交后由仓库出库','Warehouse ships it out'),"go('pr_new')"));
  if(r==='sales')tiles.push(tile('var(--blue)','ret',L('销售退货','Customer return'),L('提交后由仓库收货','Warehouse receives it'),"go('sr_new')"));
  if(r==='cashier'){tiles.push(tile('var(--blue)','doc',L('资金日记账','Cash book'),L('收付款流水 · 余额','Receipts, payments, balance'),"S.finSeg='book';tab('fin')"));tiles.push(tile('var(--tile)','globe',L('汇率换算','FX converter'),L('本币 ⇄ 美元','Local ⇄ US$'),'fxSheet()'))}
  if(r==='gm')tiles.push(tile('var(--blue)','chart',L('经营报表','Reports'),L('销售 · 利润 · 排行','Sales · profit · ranking'),"go('report')"));
  if(r==='acct')tiles.push(tile('var(--tile)','globe',L('汇率换算','FX converter'),L('本币 ⇄ 美元','Local ⇄ US$'),'fxSheet()'));
  if(tiles.length%2)tiles.push(can('report')?tile('var(--purple)','chart',L('简易报表','Reports'),L('销售额 · 排行 · 流水','Sales · ranking · log'),"go('report')"):tile('var(--purple)','bell',L('消息','Messages'),L('提醒与待办','Alerts & tasks'),"go('msgs')"));
  if(r==='gm'||r==='sales')stats=statT('g',numK(sales),L('今日销售额','Sales today'),"go('report')",1)+statT('',toShip,L('待出库','To ship'),"S.docSeg='so';S.docF='submitted';tab('docs')")+statT(low?'y':'',low,L('库存不足','Low stock'),"S.stF='low';tab('stock')");
  else if(r==='buyer')stats=statT('g',DB.all('po').filter(p=>p.status==='ordered').length,L('在途采购','Open POs'),"S.docSeg='po';S.docF='ordered';tab('docs')")+statT('',transit,L('物流在途','In transit'),"tab('logi')")+statT(low?'y':'',low,L('库存不足','Low stock'),"S.stF='low';tab('stock')");
  else if(r==='keeper')stats=statT('g',toRecv,L('待入库','To receive'),"go('recv_pick')")+statT('',toShip,L('待出库','To ship'),"S.docSeg='so';S.docF='submitted';tab('docs')")+statT(low?'y':'',low,L('库存不足','Low stock'),"S.stF='low';tab('stock')");
  else if(r==='acct')stats=statT('g',numK(F.arBal),L('应收余额','Receivable'),"S.finSeg='ar';tab('fin')",1)+statT('',numK(F.apBal),L('应付余额','Payable'),"S.finSeg='ap';tab('fin')")+statT(F.unverN?'y':'',F.unverN,L('待核对收款','To verify'),"S.finSeg='book';tab('fin')");
  else stats=statT('g',numK(F.rcvToday),L('今日收款','Received today'),"S.finSeg='book';tab('fin')",1)+statT(F.apprN?'y':'',F.apprN,L('待付款','To pay'),"S.finSeg='ap';tab('fin')")+statT('',numK(F.payMonth),L('本月付款','Paid this month'),"S.finSeg='book';tab('fin')");
  const todo=[];
  if(can('so_ship')&&toShip&&r!=='keeper')todo.push(['out',L(`${toShip} 张销售单待出库`,`${toShip} order(s) to ship`),"S.docSeg='so';S.docF='submitted';tab('docs')",'var(--gold)']);
  if(can('po_recv')&&toRecv&&r!=='keeper')todo.push(['in',L(`${toRecv} 张采购单待入库`,`${toRecv} PO(s) to receive`),"go('recv_pick')",'var(--green)']);
  const prP=DB.all('pr').filter(x=>x.status==='pending').length,srP=DB.all('sr').filter(x=>x.status==='pending').length;
  if(can('pr_exec')&&prP)todo.push(['out',L(`${prP} 张采购退货待出库`,`${prP} supplier return(s) to ship out`),"S.docSeg='ret';tab('docs')",'var(--orange)']);
  if(can('sr_exec')&&srP)todo.push(['in',L(`${srP} 张销售退货待收货`,`${srP} customer return(s) to receive`),"S.docSeg='ret';tab('docs')",'var(--purple)']);
  const tk=DB.all('counts').filter(c=>c.status==='pending').length;if(r==='gm'&&tk)todo.push(['clip',L(`${tk} 张盘点单待审核`,`${tk} stock count(s) to review`),"S.docSeg='take';tab('docs')",'var(--purple)']);
  if(can('fin_verify')&&F.unverN)todo.push(['check',L(`${F.unverN} 笔收款待核对`,`${F.unverN} receipt(s) to verify`),"S.finSeg='book';tab('fin')",'var(--purple)']);
  if(can('fin_pay')&&F.apprN)todo.push(['out',L(`${F.apprN} 笔付款已审批，待支付`,`${F.apprN} approved payment(s) to pay`),"S.finSeg='ap';tab('fin')",'var(--orange)']);
  const dr=DB.all('so').concat(DB.all('po')).filter(d=>d.status==='draft'&&d.by===me.id).length;if(dr)todo.push(['edit',L(`${dr} 张草稿未提交`,`${dr} draft(s) not submitted`),"S.docSeg='"+(can('so')?'so':'po')+"';S.docF='draft';tab('docs')",'#8A8478']);
  if(exc&&can('logi'))todo.push(['alert',L(`${exc} 票物流异常`,`${exc} shipment exception(s)`),"S.logiF='exception';tab('logi')",'var(--red)']);
  if(DB.outbox.length)todo.push(['cloud',L(`${DB.outbox.length} 条记录待提交`,`${DB.outbox.length} change(s) waiting to submit`),'syncSheet()','var(--orange)']);
  const mv=can('stock')?DB.all('moves').sort((a,b)=>b.t-a.t).slice(0,5):[];
  return `<div class="pad" style="padding-top:16px">
   ${WEB?'':`<div class="row between"><div class="row gap6" style="min-width:0"><img class="logo" src="${LOGO}" alt=""><b style="font-size:17px" class="one">${BRAND()}</b></div>
    <div class="row" style="gap:6px"><button class="syncchip" id="syncChip" onclick="syncSheet()"></button>${ctryBtn()}${langBtn()}<button class="icbtn" onclick="go('msgs')" aria-label="messages">${ic('bell')}${Alerts.unread()?'<span class="dot"></span>':''}</button></div></div>`}
   <div class="row gap6" style="margin-top:16px;white-space:nowrap;min-width:0"><span class="sm muted" style="flex:none">${greet()} · </span><b class="sm one" style="flex:none;max-width:40%">${esc(nmP(me.name))}</b><span class="badge ${ROLES[r].c}">${roleName(r)}</span><span class="xs muted one">${esc(whName(me.wh))}</span></div>
   <h1 class="hero">${L('进销存，<span class="hl">很简单</span>！','Stock made <span class="hl">simple</span>!')}</h1>
   <div class="row between" style="gap:8px"><div class="slogan one">${L('库存 · 采购 · 销售 · 财务 · 物流','STOCK · BUY · SELL · BOOKS · SHIP')}</div>${curBtn()}</div>
   ${r==='gm'?deptBoard(F,{sales,toShip,toRecv,low,transit,exc,tk}):''}
   <div style="display:flex;flex-direction:column;gap:12px;margin-top:18px">${big.join('')}${tiles.length?`<div class="wtiles">${tiles.join('')}</div>`:''}
    ${can('logi')?`<div class="wcard" onclick="tab('logi')"><div class="qi">${ic('truck')}</div><div style="flex:1;min-width:0"><div class="b fit" style="font-size:16px;white-space:nowrap">${L('物流跟踪与服务','Logistics & services')}</div>
     <div class="sm muted one">${L(`在途 ${transit} · 派送中 ${deliv} · 异常 ${exc}`,`In transit ${transit} · Out for delivery ${deliv} · Exceptions ${exc}`)}</div><div class="xs b one" style="margin-top:2px">${L('运费估算 · 预约提货 · 承运商查询','Freight quote · booking · carrier tracking')}</div></div><div class="go">${ic('arrow',16)}</div></div>`:''}
   </div>
   <div class="stats">${stats}</div>
   ${todo.length?`<div class="sec-h">${L('待办','To do')}</div><div class="box" style="margin-top:0;padding:4px 16px">${todo.map(x=>`<div class="li" onclick="${x[2]}"><div class="qi" style="background:${x[3]};color:#fff">${ic(x[0],18)}</div><div class="b sm" style="flex:1">${x[1]}</div>${ic('chev',16)}</div>`).join('')}</div>`:''}
   ${mv.length?`<div class="sec-h">${L('最近出入库','Recent movements')}${can('report')?`<a onclick="go('report')">${L('报表','Reports')} ›</a>`:''}</div><div class="box" style="margin-top:0;padding:4px 16px">${mv.map(mvRow).join('')}</div>`:''}
  </div>`};
/* 总经理：各部门进展一目了然 */
function deptBoard(F,x){const card=(role,lines,fn)=>`<div class="box" style="margin:0;padding:12px 14px;cursor:pointer" onclick="${fn}"><div class="row between"><span class="badge ${ROLES[role].c}">${roleName(role)}</span>${ic('chev',14)}</div>${lines.map(l=>`<div class="row between" style="margin-top:7px;gap:6px"><span class="xs muted one">${l[0]}</span><b class="sm ${l[2]||''}" data-notr style="white-space:nowrap">${l[1]}</b></div>`).join('')}</div>`;
  const mon=+new Date(new Date().getFullYear(),new Date().getMonth(),1);const poM=DB.all('po').filter(p=>p.t>=mon&&p.status!=='draft'&&p.status!=='cancel').reduce((a,p)=>a+docTotal(p),0);
  return `<div class="sec-h">${L('各部门进展','Department progress')}<a onclick="go('report')">${L('报表','Reports')} ›</a></div><div class="dgrid">
   ${card('buyer',[[L('本月采购额','Purchases, month'),moneyK(poM)],[L('在途采购单','Open POs'),x.toRecv],[L('库存不足','Low stock'),x.low,x.low?'red':'']],"S.docSeg='po';S.docF='all';tab('docs')")}
   ${card('sales',[[L('今日销售额','Sales today'),moneyK(x.sales)],[L('待出库','To ship'),x.toShip],[L('销售草稿','Drafts'),DB.all('so').filter(s=>s.status==='draft').length]],"S.docSeg='so';S.docF='all';tab('docs')")}
   ${card('keeper',[[L('待入库 / 待出库','To receive / ship'),x.toRecv+' / '+x.toShip],[L('待审盘点','Counts to review'),x.tk,x.tk?'red':''],[L('物流异常','Exceptions'),x.exc,x.exc?'red':'']],"tab('stock')")}
   ${card('acct',[[L('应收余额','Receivable'),moneyK(F.arBal)],[L('应付余额','Payable'),moneyK(F.apBal)],[L('待核对收款','To verify'),F.unverN,F.unverN?'red':'']],"S.finSeg='ar';tab('fin')")}
   ${card('cashier',[[L('今日收款','Received today'),moneyK(F.rcvToday)],[L('待付款','To pay'),F.apprN,F.apprN?'red':''],[L('资金余额','Cash balance'),moneyK(F.cash)]],"S.finSeg='book';tab('fin')")}
  </div>`}
function mvRow(m){const p=P_(m.pid);return `<div class="li" onclick="go('product',{id:'${m.pid}'})"><span class="badge ${(MV[m.type]||[0,0,'b-grey'])[2]}" style="min-width:64px;justify-content:center">${mvName(m.type)}</span>
  <div style="flex:1;min-width:0"><div class="b sm one">${esc(nm(p.n))}</div><div class="xs muted one">${esc(whName(m.wh))} · ${fdate(m.t)}</div></div><b class="${m.qty<0?'red':'green'}" data-notr>${m.qty>0?'+':''}${n2(m.qty)}</b></div>`}

/* ================= 库存 ================= */
S.stF='all';S.stW='all';S.stQ='';
V.stock=()=>{const sm=stockMap();const q=S.stQ.trim().toLowerCase();const W=S.stW;
  let list=DB.all('products').map(p=>{const qty=W==='all'?qtyOf(p.id):qtyOf(p.id,W);return {p,qty,s:stStatus(p,qty)}});
  const cnt={all:list.length,ok:0,low:0,over:0};list.forEach(x=>{if(x.s==='ok')cnt.ok++;else if(x.s==='over')cnt.over++;else cnt.low++});
  if(q)list=list.filter(({p})=>[p.n.zh,p.n.en,p.code,p.bar,nm(p.cat)].join(' ').toLowerCase().includes(q));
  if(S.stF!=='all')list=list.filter(x=>S.stF==='low'?(x.s==='low'||x.s==='out'):x.s===S.stF);
  const val=list.reduce((a,x)=>a+x.qty*(can('cost')?x.p.cost:x.p.price),0);
  return `<div class="pad" style="padding-top:16px"><div class="row between"><div class="ptitle">${L('库存','Stock')}</div><div class="row" style="gap:8px">${can('take')?`<button class="pill w" onclick="go('take')">${ic('clip',16)} ${L('盘点','Count')}</button>`:''}${langBtn()}</div></div>
   <div class="searchbar">${ic('search')}<input id="stQ" placeholder="${L('商品名称 / 编码 / 条码','Name / code / barcode')}" value="${esc(S.stQ)}" oninput="S.stQ=this.value;clearTimeout(window._sq);window._sq=setTimeout(()=>{render(false);const i=$('#stQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"><button class="scan" onclick="scanLookup()" aria-label="scan">${ic('scan',18)}</button></div>
   <div class="chips">${[['all',L('全部门店','All stores')]].concat(activeWh().map(w=>[w.id,nm(w.n)])).map(([k,t])=>`<span class="chip ${S.stW===k?'on':''}" onclick="S.stW='${k}';render(false)">${esc(t)}</span>`).join('')}</div>
   <div class="seg">${[['all',L('全部','All'),cnt.all],['ok',L('正常','Normal'),cnt.ok],['low',L('不足','Low'),cnt.low],['over',L('积压','Overstock'),cnt.over]].map(([k,t,n])=>`<button class="${S.stF===k?'on':''}" onclick="S.stF='${k}';render(false)">${t} ${n}</button>`).join('')}</div>
   <div class="row between sm muted" style="margin:10px 2px"><span>${list.length} ${L('种商品','items')}</span><span>${can('cost')?L('库存成本','Stock cost'):L('库存货值','Stock value')} <b style="color:var(--ink)" data-notr>${money(val)}</b></span></div>
   ${list.map(({p,qty,s})=>`<div class="wc" onclick="go('product',{id:'${p.id}'})"><div class="top"><div class="row between" style="align-items:flex-start;gap:8px">
     <div class="row gap" style="min-width:0;align-items:flex-start">${thumb(p,42)}<div style="min-width:0"><h3><span class="tt">${esc(nm(p.n))}</span></h3><small data-notr>${esc(p.code)} · ${esc(p.bar)}</small></div></div>${stBadge(s)}</div>
     <div class="cols"><div><span class="l">${L('库存','Qty')}</span><span class="v ${s==='low'||s==='out'?'red':''}">${n2(qty)} ${esc(unit(p))}</span></div>
      <div><span class="l">${can('cost')?L('成本/售价','Cost/Price'):L('售价','Price')}</span><span class="v" data-notr>${can('cost')?n2(p.cost)+' / ':''}${n2(p.price)}</span></div>
      <div><span class="l">${L('仓库','WH')}</span><span class="v">${W==='all'?Object.values((sm[p.id]||{w:{}}).w).filter(x=>x.q>0).length+L(' 个',''):esc(whName(W))}</span></div></div></div></div>`).join('')||emptyBox('search',L('没有找到商品','No items found'))}
  </div>`};
V.product=()=>{const p=DB.get('products',S.params.id);if(!p)return hdr('')+emptyBox('box',L('商品不存在','Item not found'));
  const q=qtyOf(p.id),s=stStatus(p,q);const sm=stockMap()[p.id]||{w:{}};const bs=batchesOf(p.id);const soon=Date.now()+30*864e5;
  const mv=DB.all('moves').filter(m=>m.pid===p.id).sort((a,b)=>b.t-a.t).slice(0,10);
  const warn=s==='low'||s==='out'?`<div class="note-r" style="margin-top:12px">${ic('alert',16)} ${L(`库存预警：当前 ${n2(q)}，低于安全库存 ${p.min}，建议尽快补货。`,`Low stock: ${n2(q)} on hand, below safety stock ${p.min}. Reorder soon.`)}</div>`
    :s==='over'?`<div class="note-y" style="margin-top:12px">${L(`库存积压：当前 ${n2(q)}，高于上限 ${p.max}，建议促销或调拨。`,`Overstock: ${n2(q)} on hand, above max ${p.max}. Consider promotion or transfer.`)}</div>`:'';
  return hdr(L('库存详情','Item details'),can('po')||S.me.role==='gm'?`<button class="icbtn" onclick="editProduct('${p.id}')">${ic('edit')}</button>`:'')+`<div class="pad">
   <div class="box" style="margin-top:6px"><div class="row gap" style="align-items:flex-start">${thumb(p,64)}<div style="flex:1;min-width:0"><div class="b" style="font-size:19px;line-height:1.25">${esc(nm(p.n))}</div>
     <div class="xs muted" style="margin-top:3px" data-notr>${esc(p.code)} · ${esc(p.bar)}</div><div class="row gap6" style="margin-top:6px">${stBadge(s)}<span class="badge b-grey">${esc(nm(p.cat))}</span>${p.batch?`<span class="badge b-lime">${L('批次管理','Batch tracked')}</span>`:''}</div></div></div>
    <div class="row" style="margin-top:14px;align-items:baseline;gap:6px"><span style="font-size:34px;font-weight:800;letter-spacing:-1px" class="${s==='low'||s==='out'?'red':''}" data-notr>${n2(q)}</span><span class="muted">${esc(unit(p))}</span></div>
    <div class="kv" style="margin-top:10px">${can('cost')?`<div><div class="l">${L('成本价','Cost')}</div><div class="v" data-notr>${money(p.cost)}</div></div>`:''}<div><div class="l">${L('售价','Price')}</div><div class="v" data-notr>${money(p.price)}</div></div>
     <div><div class="l">${L('安全库存 / 上限','Min / Max')}</div><div class="v" data-notr>${p.min} / ${p.max||'—'}</div></div><div><div class="l">${L('供应商','Supplier')}</div><div class="v">${esc(ptName(p.sup))}</div></div></div>${warn}</div>

/* ---------- 扫码（相机 BarcodeDetector；不支持时手动输入） ---------- */
let _scan=null;
function _scanStop(){if(_scan){clearInterval(_scan.t);try{_scan.st&&_scan.st.getTracks().forEach(t=>t.stop())}catch(e){}_scan=null}}
async function openScan(title,onCode,cont){_scanStop();
  const demo=!DB.cloud?`<div class="xs muted" style="margin-top:12px">${L('没有实物条码？点下面的示例条码试试：','No barcode at hand? Try a sample:')}</div><div class="chips wrap" style="margin-top:6px">${DB.all('products').slice(0,6).map(p=>`<span class="chip sm" data-notr onclick="_scanHit('${p.bar}')">${p.bar}</span>`).join('')}</div>`:'';
  openSheet(`<div class="row between"><div class="sh">${title}</div><button class="icbtn" onclick="closeSheet()">${ic('x')}</button></div>
   <div class="scanv"><video id="scv" playsinline muted></video><div class="frame"></div><div class="laser"></div></div><div id="scMsg" class="sm muted" style="margin-top:8px;text-align:center">${L('正在打开相机…','Opening camera…')}</div>
   <div class="row gap" style="margin-top:10px"><input class="inp" id="scIn" inputmode="numeric" placeholder="${L('或手动输入条码 / 编码','Or type barcode / code')}" onkeydown="if(event.key==='Enter')_scanHit(this.value)"><button class="pill g" onclick="_scanHit($('#scIn').value)">${L('确定','OK')}</button></div><div id="scLog"></div>${demo}`);
  window._scanHit=c=>{c=String(c||'').trim();if(!c)return;const now=Date.now();if(_scan&&_scan.last===c&&now-_scan.lt<1500)return;if(_scan){_scan.last=c;_scan.lt=now}
    try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}const ok=onCode(c);if(!cont&&ok!==false){closeSheet()}else{const i=$('#scIn');if(i)i.value=''}};
  _scan={last:'',lt:0};const msg=t=>{const m=$('#scMsg');if(m)m.textContent=t};
  if(!('BarcodeDetector' in window)||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg(L('此设备不支持相机扫码，请手动输入条码','Camera scanning not supported here — type the barcode'));return}
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});if(!_scan){st.getTracks().forEach(t=>t.stop());return}_scan.st=st;const v=$('#scv');v.srcObject=st;await v.play();
    let fm=['ean_13','ean_8','code_128','code_39','upc_a','qr_code'];try{const sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(f=>sup.includes(f))}catch(e){}
    const det=new BarcodeDetector({formats:fm});msg(L('将条码放入框内','Point the barcode at the frame'));
    _scan.t=setInterval(async()=>{if(!_scan||v.readyState<2)return;try{const r=await det.detect(v);if(r&&r[0])_scanHit(r[0].rawValue)}catch(e){}},250)}
  catch(e){msg(L('无法打开相机：请允许相机权限，或手动输入','Cannot open camera — allow permission or type the code'))}}
