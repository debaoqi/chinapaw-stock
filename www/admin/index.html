<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>华宝进销存 · 管理后台</title>
<link rel="icon" href="../icon-192.png">
<style>
:root{
  --bg:#F7F5F0;--card:#FFFFFF;--ink:#1C1C1E;--muted:#8A8478;--line:#ECE7DE;--soft:#F1ECDF;
  --purple:#7B4FA0;--lilac:#EFE6F6;--gold:#F2B705;--red:#D8432E;--lime:#E3F3EA;--orange:#E87A2B;--blue:#2367B0;--green:#0B7A4B;
  --tile:#C8552D;--r:28px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:#D9D2C1;background-image:linear-gradient(#cfc7b5 1px,transparent 1px),linear-gradient(90deg,#cfc7b5 1px,transparent 1px);background-size:32px 32px;
  display:flex;align-items:center;justify-content:center;min-height:100vh}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden}
.sbar{display:none}
@media (min-width:520px){
  .phone{width:390px;height:min(844px,calc(100vh - 32px));min-height:600px;border-radius:54px;border:11px solid #111;box-shadow:0 40px 80px rgba(0,0,0,.25)}
  .sbar{display:flex;position:absolute;top:0;left:0;right:0;height:46px;z-index:30;justify-content:space-between;align-items:center;padding:6px 30px 0;font-weight:600;font-size:15px;pointer-events:none;background:var(--bg)}
  .sbar .island{width:110px;height:30px;background:#111;border-radius:20px}
  .phone .screen{top:46px}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;scrollbar-width:none;padding-top:env(safe-area-inset-top)}
.screen::-webkit-scrollbar{display:none}
.screen.nonav{padding-bottom:110px}
.pad{padding:14px 20px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}.gap6{gap:6px}.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}.sm{font-size:12.5px}.xs{font-size:11px}.b{font-weight:700}.red{color:var(--red)}.green{color:var(--green)}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fade{animation:fd .26s ease}@keyframes fd{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.logo{width:36px;height:36px;border-radius:12px;object-fit:cover}
.icbtn{width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--ink);display:grid;place-items:center;position:relative;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.icbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.langbtn{display:inline-grid;place-items:center;border:0;border-radius:50%;background:var(--card);cursor:pointer;font-weight:800;font-size:13px;width:36px;height:36px;padding:0;color:#161616;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.syncchip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:20px;padding:7px 11px;font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.syncchip i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
.syncchip.off i{background:var(--orange)}.syncchip.busy i{background:var(--blue);animation:pl 1s infinite}
@keyframes pl{50%{opacity:.3}}
.hero{font-size:29px;line-height:1.18;font-weight:800;letter-spacing:-.6px;margin:20px 0 4px;white-space:nowrap;overflow:hidden}
.hero .hl{background:var(--gold);padding:0 8px;border-radius:12px;display:inline-block;transform:rotate(-2deg)}
.slogan{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:2px;white-space:nowrap}
/* big entry cards (ChinaPaw welcome) */
.sc{border-radius:32px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s}
.sc:active,.wtile:active,.wc:active{transform:scale(.985)}
.sc .ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#111;flex:none}
.sc .go{width:37px;height:37px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#111;flex:none}
.sc .t{font-size:21px;font-weight:800;line-height:1.15;white-space:nowrap}
.sc .roles{font-size:12.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.wtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wtile{border-radius:24px;padding:14px 14px 15px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0;color:#fff;transition:transform .15s}
.wtile .b{font-size:15.5px;line-height:1.25;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtile .wsub{color:rgba(255,255,255,.82);margin-top:2px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wti{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.2);color:#fff}
.wcard{background:var(--card);border-radius:28px;padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer}
.wcard .qi{width:44px;height:44px;border-radius:14px;background:var(--gold);display:grid;place-items:center;flex:none}
.wcard .go{width:34px;height:34px;border-radius:50%;background:#161616;color:#fff;display:grid;place-items:center;flex:none}
/* stats */
.stats{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--card);border-radius:20px;padding:12px;min-width:0}
.stat .n{font-size:21px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .l{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.g{background:var(--green);color:#fff}.stat.g .l{color:rgba(255,255,255,.8)}
.stat.y{background:var(--gold)}.stat.y .l{color:rgba(0,0,0,.6)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;font-size:18px;font-weight:800}
.sec-h a{font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
/* search */
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:30px;padding:6px 6px 6px 16px;color:var(--muted);margin-top:12px}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:15px;color:var(--ink);min-width:0;padding:8px 0}
.searchbar .scan{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -20px 0;padding:2px 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{border-radius:30px;padding:8px 14px;font-size:13px;background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1.5px solid transparent;font-weight:600;flex:none}
.chip.on{background:#161616;color:#fff}
.chip.sm{padding:5px 10px;font-size:12px}
.chip .n{background:rgba(0,0,0,.08);border-radius:10px;padding:0 6px;font-size:11px}
.chip.on .n{background:rgba(255,255,255,.2)}
.seg{display:flex;background:var(--card);border-radius:30px;padding:4px;margin:12px 0 4px}
.seg button{flex:1;padding:9px 4px;border-radius:26px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:#161616;color:#fff}
/* list cards (ChinaPaw job card) */
.wc{background:#fff;border:1px solid #D9CFB8;box-shadow:0 1px 3px rgba(60,45,10,.10);border-radius:16px;margin-bottom:9px;cursor:pointer;overflow:hidden;transition:transform .15s}
.wc .top{padding:9px 13px}
.wc h3{font-size:16.5px;font-weight:800;letter-spacing:-.3px;line-height:1.2;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wc h3 .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wc small{display:block;font-size:11.5px;color:#7A725F;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .tag{padding:1px 7px;font-size:10.5px;font-weight:700;border-radius:9px;background:#E3D7BC;color:#4A3A12;flex:none;line-height:1.5}
.badge{border-radius:30px;padding:3px 9px;font-size:11px;white-space:nowrap;font-weight:700;flex:none;display:inline-flex;align-items:center;gap:3px}
.b-green{background:var(--green);color:#fff}.b-red{background:var(--red);color:#fff}.b-gold{background:var(--gold);color:#161616}
.b-blue{background:var(--blue);color:#fff}.b-purple{background:var(--purple);color:#fff}.b-grey{background:#D6D3CC;color:#161616}
.b-orange{background:var(--orange);color:#fff}.b-dark{background:#161616;color:#fff}.b-lime{background:var(--lime);color:var(--green)}
.cols{display:flex;margin-top:5px}
.cols>div{flex:1;padding-right:6px;margin-right:7px;border-right:1px solid #D9CFB8;min-width:0;display:flex;align-items:baseline;gap:4px}
.cols>div:last-child{border:0;margin:0}
.cols>div:nth-child(2){flex:1.6}
.cols .l{font-size:10px;color:#8E8672;flex:none}
.cols .v{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.box{background:var(--card);border-radius:24px;padding:16px 18px;margin-top:14px}
.box h4{font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.li .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--soft)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.kv .l{font-size:11.5px;color:var(--muted)}.kv .v{font-size:15px;font-weight:700;margin-top:2px;word-break:break-word}
.note-y{background:#FFF3CF;border:1px solid #F2D27A;border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.6}
.note-r{background:#FCE9E5;border:1px solid #F1B9AE;border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.6;color:#8A2416}
.note-g{background:var(--lime);border-radius:16px;padding:11px 14px;font-size:13px;line-height:1.6;color:#0A5134}
.empty{text-align:center;color:var(--muted);padding:44px 10px;font-size:14px}
.empty svg{width:40px;height:40px;stroke-width:1.4;margin-bottom:8px}
/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:14px 20px 4px}
.hdr .ttl{flex:1;min-width:0;text-align:center;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sp{width:40px;flex:none}
.ptitle{font-size:26px;font-weight:800;letter-spacing:-.5px}
/* forms */
.fld{margin-top:14px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--card);color:var(--ink);border:1.5px solid transparent;border-radius:16px;padding:13px 15px;font-size:15px;outline:none}
.inp:focus{border-color:var(--green)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.inp{min-height:76px;resize:vertical}
.qty{display:inline-flex;align-items:center;background:var(--soft);border-radius:20px;overflow:hidden;flex:none}
.qty button{width:32px;height:32px;font-size:18px;font-weight:700}
.qty input{width:52px;text-align:center;border:0;background:none;font-weight:800;font-size:15px;outline:none;padding:6px 0}
.bigbtn{flex:1;background:var(--green);color:#fff;border-radius:40px;height:54px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;padding:0 14px;min-width:0}
.bigbtn.dark{background:#161616}.bigbtn.ghost{background:var(--card);color:#161616}.bigbtn.red{background:var(--red)}.bigbtn.gold{background:var(--gold);color:#161616}
.bigbtn:disabled{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:8px 14px;font-size:13px;font-weight:700;white-space:nowrap;background:#161616;color:#fff;flex:none}
.pill.g{background:var(--green)}.pill.w{background:var(--card);color:#161616}
.bbar{position:absolute;left:0;right:0;bottom:0;padding:12px 20px calc(18px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -10px 20px -12px rgba(0,0,0,.18);display:flex;gap:10px;z-index:20}
.total{display:flex;flex-direction:column;justify-content:center;flex:none;min-width:0}
.total .l{font-size:11px;color:var(--muted)}.total .v{font-size:19px;font-weight:800;white-space:nowrap}
/* bottom tab nav (ChinaPaw v4.4.3) */
.tnav{position:absolute;left:0;right:0;bottom:0;z-index:25;display:flex;background:rgba(251,249,245,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(0,0,0,.08);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:#111;min-width:0}
.tnav .ti{position:relative;display:grid;place-items:center;width:44px;height:28px}
.tnav .ti svg{width:22px;height:22px;stroke-width:2.1}
.tnav .tl{font-size:11.5px;font-weight:700;white-space:nowrap}
.tnav button.on{color:#0B7A4B}.tnav button.on .tl{font-weight:800}
.tnav .cnt{position:absolute;top:-3px;right:2px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:10px;display:grid;place-items:center;padding:0 4px;font-weight:800}
/* sheet / toast / banner */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.25s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:34px 34px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));z-index:41;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:#CFC8BA;margin:0 auto 14px}
.sheet .sh{font-size:20px;font-weight:800;margin-bottom:4px}
.toast{position:absolute;left:50%;bottom:104px;transform:translate(-50%,20px);max-width:88%;text-align:center;background:rgba(28,28,30,.92);color:#fff;padding:12px 18px;border-radius:30px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none;display:flex;gap:8px;align-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.banner{position:absolute;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:55;background:#161616;color:#fff;border-radius:22px;padding:12px 14px;display:flex;gap:12px;align-items:center;transform:translateY(calc(-100% - 90px));transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 30px rgba(0,0,0,.25);cursor:pointer}
@media (min-width:520px){.banner{top:52px}}
.banner.on{transform:none}
.banner .qi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--gold);color:#161616}
.offbar{background:var(--orange);color:#fff;font-size:12.5px;font-weight:700;padding:8px 20px;display:flex;align-items:center;gap:8px}
.updbar{background:var(--gold);color:#161616;font-size:12.5px;font-weight:800;padding:8px 20px;display:flex;align-items:center;gap:8px;cursor:pointer}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;transition:height .2s}
/* timeline */
.tl{position:relative;padding-left:22px}
.tl .ev{position:relative;padding:0 0 16px}
.tl .ev:before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:#CFC8BA}
.tl .ev:after{content:"";position:absolute;left:-13px;top:17px;bottom:-3px;width:2px;background:#E2DCCF}
.tl .ev:last-child:after{display:none}
.tl .ev.cur:before{background:var(--green);box-shadow:0 0 0 4px var(--lime)}
.tl .ev .t1{font-weight:800;font-size:14px}.tl .ev .t2{font-size:12px;color:var(--muted);margin-top:2px}
.steps{display:flex;align-items:flex-start;margin-top:12px}
.steps .st{flex:1;text-align:center;font-size:10.5px;color:var(--muted);position:relative;min-width:0}
.steps .st b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#E2DCCF;color:#fff;margin:0 auto 5px;font-size:11px}
.steps .st.ok{color:var(--ink);font-weight:700}.steps .st.ok b{background:var(--green)}
.steps .st:not(:last-child):after{content:"";position:absolute;top:12px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:#E2DCCF}
.steps .st.ok:not(:last-child):after{background:var(--green)}
/* scanner */
.scanv{position:relative;border-radius:24px;overflow:hidden;background:#000;aspect-ratio:1/1;margin-top:8px}
.scanv video{width:100%;height:100%;object-fit:cover}
.scanv .frame{position:absolute;inset:18% 12%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanv .laser{position:absolute;left:14%;right:14%;height:2px;background:#4ADE80;top:50%;animation:lz 1.6s ease-in-out infinite alternate}
@keyframes lz{from{top:22%}to{top:78%}}
/* chart */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bars .bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars .bar{width:100%;max-width:28px;border-radius:8px 8px 4px 4px;background:#DCD5C6}
.bars .bar.on{background:var(--green)}
.bars .bl{font-size:10px;color:var(--muted)}
.bars .bv{font-size:9.5px;font-weight:700;white-space:nowrap}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank .no{width:22px;height:22px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.rank .no.t{background:var(--gold)}
.rank .meter{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:4px}
.rank .meter i{display:block;height:100%;background:var(--green);border-radius:4px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111;flex:none;font-size:16px;background:var(--gold)}
.av.lg{width:64px;height:64px;font-size:24px;border:3px solid #fff}
.sw{width:46px;height:28px;border-radius:20px;background:#D6D3CC;position:relative;flex:none;transition:.2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--green)}.sw.on:after{left:21px}
.thumb{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;overflow:hidden;font-weight:800;color:#6E6656}
.thumb img{width:100%;height:100%;object-fit:cover}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos .ph{width:72px;height:72px;border-radius:14px;overflow:hidden;background:var(--soft);display:grid;place-items:center;position:relative;cursor:pointer;color:var(--muted)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:grid;place-items:center}
.login-hero{background:var(--green);color:#fff;border-radius:0 0 36px 36px;padding:26px 22px 30px}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.demo button{background:var(--card);border-radius:16px;padding:10px 12px;text-align:left;font-size:12px;line-height:1.35}
.demo button b{display:block;font-size:13.5px}

const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}>${ICONS[n]||''}</svg>`;

/* ---------- 格式化 ---------- */
const CUR=()=>(DB.get('settings','app')||{}).cur||'GH₵';
const n2=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const money=n=>CUR()+' '+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const numK=n=>{n=+n||0;return Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e4?(n/1e3).toFixed(1)+'k':n2(n)};
const moneyK=n=>{n=+n||0;return CUR()+' '+(Math.abs(n)>=1e6?(n/1e6).toFixed(2)+'M':Math.abs(n)>=1e4?(n/1e3).toFixed(1)+'k':n2(n))};
const pad2=n=>String(n).padStart(2,'0');
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(t,withTime=true){if(!t)return '';const d=new Date(t);const tm=withTime?' '+pad2(d.getHours())+':'+pad2(d.getMinutes()):'';
  return S.lang==='zh'?`${d.getMonth()+1}月${d.getDate()}日${tm}`:`${MON[d.getMonth()]} ${d.getDate()}${tm}`}
function fday(t){if(!t)return '';const d=new Date(t);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return L('刚刚','just now');if(s<3600)return Math.floor(s/60)+L(' 分钟前',' min ago');
  if(s<86400)return Math.floor(s/3600)+L(' 小时前',' h ago');if(s<172800)return L('昨天','yesterday');return fdate(t,false)}
const dayStart=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return +d};

/* ---------- 角色权限 ---------- */
const ROLES={
 admin:{zh:'管理员',en:'Admin',c:'b-dark',p:'*'},
 buyer:{zh:'采购员',en:'Purchaser',c:'b-blue',p:['stock','po','po_ret','logi','report','cost','partner']},
 sales:{zh:'销售员',en:'Sales',c:'b-gold',p:['stock','so','so_ret','logi','report','partner']},
 keeper:{zh:'库管',en:'Warehouse keeper',c:'b-green',p:['stock','po_recv','po_ret','so_ship','so_ret','take','logi','report','cost']},
 viewer:{zh:'查看者',en:'Viewer',c:'b-grey',p:['stock','report']}
};
function can(p,u){u=u||S.me;if(!u)return false;const r=ROLES[u.role];if(!r)return false;return r.p==='*'||r.p.includes(p)}
const roleName=r=>nm(ROLES[r]||{zh:r,en:r});

/* ================= 数据层：本机数据库 + 待提交队列（离线可用） + 云端同步 ================= */
const KINDS=['settings','wh','products','partners','moves','po','grn','pr','so','sr','counts','ships','svc','users'];
const DB={
  d:{},outbox:[],seq:0,lastSync:0,ver:0,cloud:!!(CFG.supabaseUrl&&CFG.supabaseAnonKey),
  load(){const s=LS.get('db',null);KINDS.forEach(k=>this.d[k]=(s&&s[k])||[]);this.outbox=LS.get('outbox',[]);this.seq=LS.get('seq',0);this.lastSync=LS.get('lastSync',0);this.ver++},
  save(){const o={};KINDS.forEach(k=>o[k]=this.d[k]);LS.set('db',o);LS.set('outbox',this.outbox);LS.set('seq',this.seq);LS.set('lastSync',this.lastSync)},
  all(k){return (this.d[k]||[]).filter(x=>!x.del)},
  get(k,id){return (this.d[k]||[]).find(x=>x.id===id)},
  /* 写入一条记录：本机立即生效，进入待提交队列；联网后自动提交到云端 */
  put(k,doc,opt={}){doc={...doc};if(!doc.id)doc.id=uid(k.slice(0,2));doc.u=Date.now();doc.by=doc.by||(S.me&&S.me.id)||'';
    const a=this.d[k]||(this.d[k]=[]);const i=a.findIndex(x=>x.id===doc.id);if(i>=0)a[i]=doc;else a.push(doc);
    if(!opt.local){this.outbox.push({k,id:doc.id,d:doc});doc._q=1}
    this.ver++;this.save();if(!opt.quiet){bc('chg',[{k,d:doc}]);setTimeout(()=>Sync.run(),50)}return doc},
  merge(rows){let n=0;rows.forEach(r=>{const a=this.d[r.k]||(this.d[r.k]=[]);const i=a.findIndex(x=>x.id===r.d.id);
      if(i>=0){if(a[i]._q&&this.outbox.some(o=>o.k===r.k&&o.id===r.d.id))return;if((a[i].u||0)>(r.d.u||0)&&!r.force)return;a[i]=r.d}else a.push(r.d);n++});
    if(n){this.ver++;this.save()}return n}
};
/* 同一台设备多个窗口之间实时同步（演示多人协作，也让手机桌面版与浏览器版保持一致） */
let BC=null;try{BC=new BroadcastChannel('jxc')}catch(e){}
function bc(type,rows){try{BC&&BC.postMessage({type,rows})}catch(e){}}
if(BC)BC.onmessage=e=>{const m=e.data||{};if(m.type==='chg'){const rows=(m.rows||[]).map(r=>({k:r.k,d:{...r.d,_q:0},force:true}));DB.merge(rows);onRemote(rows)}
  else if(m.type==='reset'){DB.load();if(window.render)render(false)}};
function onRemote(rows){try{typeof Alerts!=='undefined'&&Alerts.scan(rows)}catch(e){console.error(e)}if(window.softRender)softRender()}

/* 云端（Supabase）：所有读写都走 RPC 函数，便于权限控制（与 ChinaPaw 相同的安全原则） */
async function rpc(fn,args){const r=await fetch(CFG.supabaseUrl.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',
   headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify(args||{})});
  const tx=await r.text();if(!r.ok){let m=tx;try{m=JSON.parse(tx).message||tx}catch(e){}throw new Error(m)}return tx?JSON.parse(tx):null}
const Sync={timer:null,
  async run(force){
    if(S.syncing)return;if(!navigator.onLine){S.online=false;window.syncUI&&syncUI();return}
    S.syncing=true;window.syncUI&&syncUI();
    try{
      if(DB.cloud&&S.token){
        for(let b=0;DB.outbox.length&&b<25;b++){const ops=DB.outbox.slice(0,200).map(o=>({k:o.k,id:o.id,d:{...o.d,_q:undefined}}));
          const r=await rpc('jxc_push',{p_token:S.token,p_ops:ops});
          DB.outbox.splice(0,ops.length);ops.forEach(o=>{const x=DB.get(o.k,o.id);if(x&&!DB.outbox.some(q=>q.k===o.k&&q.id===o.id))delete x._q});
          if(r&&r.rejected&&r.rejected.length){const rj=new Set(r.rejected);ops.filter(o=>rj.has(o.id)).forEach(o=>{DB.d[o.k]=(DB.d[o.k]||[]).filter(x=>x.id!==o.id)});DB.seq=0;DB.ver++}
          if(r&&r.rejected&&r.rejected.length)toast(L('有 ','')+r.rejected.length+L(' 条记录无权限，未提交',' change(s) rejected (no permission)'))}

let _sm=null,_smv=-1;
function stockMap(){if(_smv===DB.ver&&_sm)return _sm;const m={};
  DB.all('moves').forEach(v=>{const p=m[v.pid]||(m[v.pid]={q:0,w:{}});p.q+=v.qty;const w=p.w[v.wh]||(p.w[v.wh]={q:0,b:{}});w.q+=v.qty;
    const bk=v.batch||'-';const b=w.b[bk]||(w.b[bk]={q:0,exp:v.exp||'',batch:v.batch||''});b.q+=v.qty;if(v.exp&&!b.exp)b.exp=v.exp});

const qtyOf=(pid,wh)=>{const p=stockMap()[pid];if(!p)return 0;return wh?((p.w[wh]||{}).q||0):p.q};
function batchesOf(pid,wh){const p=stockMap()[pid];if(!p)return [];const out=[];Object.entries(p.w).forEach(([w,x])=>{if(wh&&w!==wh)return;
  Object.values(x.b).forEach(b=>{if(Math.abs(b.q)>1e-9)out.push({...b,wh:w})})});return out.sort((a,b)=>(a.exp||'9999').localeCompare(b.exp||'9999'))}

function resizeImg(f,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)})}

  i.onchange=async()=>{const f=i.files[0];if(!f)return;const du=await resizeImg(f,max||1000);cb(await upImg(du))};i.click()}
async function sha1(u8){const h=await crypto.subtle.digest('SHA-1',u8);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
const upCache=LS.get('mediaUp',{});

  if(!DB.cloud||typeof du!=='string'||!du.startsWith('data:image/'))return du;
  const m=/^data:(image\/(jpeg|jpg|png|webp));base64,([\s\S]*)$/.exec(du);if(!m)return du;
  try{const bin=atob(m[3]);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const h=await sha1(u8);if(upCache[h])return upCache[h];const ext=m[2]==='png'?'png':'jpg',type=ext==='jpg'?'image/jpeg':'image/png';
    const name='jxc/'+h.slice(0,2)+'/'+h+'.'+ext;const BASE=CFG.supabaseUrl.replace(/\/$/,'');let ok=false;
    for(let a=0;a<4&&!ok;a++){if(a)await new Promise(z=>setTimeout(z,[0,800,2000,4500][a]));
      try{const r=await fetch(BASE+'/storage/v1/object/media/'+name,{method:'POST',headers:{apikey:CFG.supabaseAnonKey,Authorization:'Bearer '+CFG.supabaseAnonKey,'Content-Type':type,'cache-control':'max-age=31536000','x-upsert':'false'},body:new Blob([u8],{type})});
        if(r.ok){ok=true;break}const t=await r.text().catch(()=>'');if(/Duplicate|already exists/i.test(t)){ok=true;break}if(r.status<500&&r.status!==429)break}catch(e){}}

/* ---------- 版本更新（与 ChinaPaw 相同：读取 version.json，网页版一键刷新，安装包版在 App 内下载安装） ---------- */
const UPD={remote:null,busy:false};
const APK_URLS=()=>{const v=UPD.remote||{};return [v.apkMirror,v.apk,v.apkExt].filter(Boolean)};
const hasUpd=()=>UPD.remote&&(+UPD.remote.build||0)>APP_BUILD;
function updNotes(v){const n=(v.notes&&(v.notes[S.lang]||v.notes.en))||[];return n.length?`<div class="sm muted" style="margin-top:14px;font-weight:700">${L('更新内容','What\'s new')}</div><ul style="margin:6px 0 0 18px;font-size:14px;line-height:1.7">${n.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
async function nativeBuild(){try{const r=await window.Capacitor.Plugins.App.getInfo();return +r.build||0}catch(e){return 0}}
async function checkUpdate(manual){if(UPD.busy)return;UPD.busy=true;
  try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const v=await r.json();UPD.remote=v;
    const nb=isNative()?await nativeBuild():0;
    if(isNative()&&v.minNative&&nb&&nb<v.minNative){showUpd(v,'apk');return}
    if((+v.build||0)>APP_BUILD){if(!manual&&!v.force){const d=LS.get('updLater',null);if(d&&d.b===v.build&&Date.now()-d.t<2*3600e3)return}showUpd(v,'web');return}
    if(manual)toast(L('已是最新版本','You have the latest version')+' · v'+APP_VER)}
  catch(e){if(manual)toast(L('检查更新失败，请检查网络','Update check failed, check your network'))}
  finally{UPD.busy=false;window.syncUI&&syncUI()}}
function showUpd(v,kind){const force=!!v.force||kind==='apk'&&v.forceNative;
  openSheet(`<div class="row gap"><img src="logo.svg" class="logo" style="width:52px;height:52px;border-radius:16px"><div><div class="sh">${L('发现新版本','New version available')}</div>
   <div class="sm muted">v${APP_VER} → <b style="color:var(--ink)">v${esc(v.version)}</b>${v.date?' · '+esc(v.date):''}</div></div></div>${updNotes(v)}
   ${kind==='apk'?`<div class="note-y" style="margin-top:14px">${L('这次更新需要安装新的安装包，下载后点“安装”即可，数据不会丢失。','This update needs a new app package. Download and tap Install — your data stays.')}</div>`:''}
   ${force?`<div class="xs red" style="margin-top:10px">${L('此版本为必要更新','This update is required')}</div>`:''}
   <div class="row gap" style="margin-top:18px">${force?'':`<button class="bigbtn ghost" onclick="updLater(${+v.build||0})">${L('稍后','Later')}</button>`}
   <button class="bigbtn" onclick="${kind==='apk'?'doApk()':'doUpdate()'}">${kind==='apk'?L('下载安装','Download'):L('立即更新','Update now')}</button></div>`,force)}
function updLater(b){LS.set('updLater',{b,t:Date.now()});closeSheet()}
async function doUpdate(){LS.set('updFrom',APP_VER);
  try{if('serviceWorker' in navigator){const rg=await navigator.serviceWorker.getRegistration();if(rg){await rg.update();if(rg.waiting)rg.waiting.postMessage('skip')}}
    if(window.caches){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(e){}
  location.replace(location.pathname+'?v='+(UPD.remote?UPD.remote.build:Date.now()))}
/* 安卓 App：用内置下载器下载新安装包（显示进度），然后调起系统安装 */
const UPX={st:'idle',pct:0,done:0,total:0};let _updL=null;
const mb=b=>(b/1048576).toFixed(1)+' MB';
function hasUpdater(){try{return !!(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.AppUpdater)}catch(e){return false}}
function updSheet(){const s=UPX.st;const bar=`<div style="height:12px;border-radius:8px;background:#E7E1D4;overflow:hidden;margin-top:16px"><div id="updBar" style="height:100%;width:${Math.max(3,UPX.pct)}%;background:var(--green);transition:width .25s"></div></div>
   <div class="row between sm" style="margin-top:8px"><span id="updPct" class="b">${UPX.pct>=0?UPX.pct+'%':''}</span><span id="updSz" class="muted">${UPX.total?mb(UPX.done)+' / '+mb(UPX.total):''}</span></div>`;
  const head=`<div class="row gap"><img src="logo.svg" class="logo" style="width:52px;height:52px;border-radius:16px"><div><div class="sh">${L('华宝进销存','ChinaPaw Stock')} v${esc((UPD.remote||{}).version||'')}</div><div class="sm muted">${s==='dl'?L('正在下载…','Downloading…'):s==='ready'?L('下载完成','Downloaded'):s==='perm'?L('需要允许安装','Allow installs'):L('下载失败','Download failed')}</div></div></div>`;
  let body='';
  if(s==='dl')body=bar+`<button class="bigbtn ghost" style="width:100%;margin-top:16px" onclick="updCancel()">${L('取消','Cancel')}</button>`;
  else if(s==='ready')body=bar+`<button class="bigbtn" style="width:100%;margin-top:16px" onclick="updInstall()">${L('安装','Install')}</button>`;
  else if(s==='perm')body=`<div class="note-y" style="margin-top:14px">${L('请在设置中允许“安装未知应用”，返回后会自动继续安装。','Please allow “Install unknown apps” in settings; installation continues when you return.')}</div><button class="bigbtn" style="width:100%;margin-top:16px" onclick="updPermit()">${L('去设置','Open settings')}</button>`;
  else body=`<div class="note-r" style="margin-top:14px">${esc(UPX.err||'')}</div><div class="row gap" style="margin-top:16px"><button class="bigbtn ghost" onclick="updBrowser()">${L('用浏览器下载','Use browser')}</button><button class="bigbtn" onclick="doApk()">${L('重试','Retry')}</button></div>`;
  openSheet(head+body,s==='dl')}
function updProg(){const b=$('#updBar');if(!b)return;b.style.width=Math.max(3,UPX.pct)+'%';$('#updPct').textContent=UPX.pct>=0?UPX.pct+'%':'';$('#updSz').textContent=UPX.total?mb(UPX.done)+' / '+mb(UPX.total):''}
async function doApk(){
  if(!isNative())return window.open(APK_URLS()[0]||'app/ChinaPawStock.apk','_blank');
  if(!hasUpdater())return updBrowser();
  const P=window.Capacitor.Plugins.AppUpdater;if(!_updL)_updL=await P.addListener('progress',p=>{UPX.pct=p.pct;UPX.done=p.done;UPX.total=p.total;updProg()});
  UPX.st='dl';UPX.pct=0;UPX.done=0;UPX.total=0;UPX.err='';updSheet();let ok=false;
  for(const u of APK_URLS()){try{await P.download({url:u});ok=true;break}catch(e){UPX.err=String(e&&e.message||e);if(/cancelled/.test(UPX.err))return}}
  if(!ok){UPX.st='fail';updSheet();return}UPX.st='ready';UPX.pct=100;updSheet();updInstall()}
async function updInstall(){const P=window.Capacitor.Plugins.AppUpdater;try{const r=await P.install();if(r&&r.needPermission){UPX.st='perm';UPX.wait=true;updSheet()}}catch(e){UPX.st='fail';UPX.err=String(e.message||e);updSheet()}}
function updPermit(){UPX.wait=true;window.Capacitor.Plugins.AppUpdater.openInstallSettings()}
function updCancel(){UPX.st='idle';try{window.Capacitor.Plugins.AppUpdater.cancel()}catch(e){}closeSheet(true)}
function updBrowser(){const v=UPD.remote||{};location.href=v.apkMirror||v.apk||'app/ChinaPawStock.apk'}
try{window.Capacitor&&window.Capacitor.Plugins.App&&window.Capacitor.Plugins.App.addListener('resume',async()=>{if(!UPX.wait||!hasUpdater())return;
  const r=await window.Capacitor.Plugins.AppUpdater.canInstall();if(r.allowed){UPX.wait=false;UPX.st='ready';updSheet();updInstall()}})}catch(e){}

const Alerts={scan(){},low(){}};
const page=(title,right,body)=>`<div class="wrapx"><div class="row between" style="gap:10px;flex-wrap:wrap"><div class="ptitle">${title}</div><div class="row gap">${right||''}</div></div>${body}</div>`;
const table=(heads,rows)=>`<div class="tbw"><table class="tb"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${heads.length}" class="muted" style="text-align:center;padding:30px">${L('暂无数据','No data')}</td></tr>`}</tbody></table></div>`;
const biname=(o)=>typeof o==='object'&&o?o:{zh:o||'',en:o||''};

/* ---------- 登录（仅管理员） ---------- */
V.login=()=>`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="box" style="width:min(420px,100%);padding:28px">
  <div class="row between"><div class="row gap6"><img class="logo" src="logo.svg"><b style="font-size:18px">${L('进销存 · 管理后台','Stock · Admin')}</b></div>${langBtn()}</div>
  <div class="fld"><label>${L('管理员手机号','Admin phone')}</label><input class="inp" id="lgPhone" value="${esc(LS.get('lastPhone',''))}" style="background:#F7F5F0"></div>
  <div class="fld"><label>${L('密码','Password')}</label><input class="inp" id="lgPw" type="password" style="background:#F7F5F0" onkeydown="if(event.key==='Enter')admLogin()"></div>
  <div id="lgErr" class="sm red" style="margin-top:10px;min-height:18px"></div><button class="bigbtn" style="width:100%" onclick="admLogin()">${L('登录','Sign in')}</button>
  ${!DB.cloud?`<div class="note-g" style="margin-top:14px">${L('本机演示：管理员 0240000001 / 123456','Local demo: admin 0240000001 / 123456')}</div>`:''}
  <div class="xs muted" style="text-align:center;margin-top:16px">${L('操作会记录在操作日志中','Actions are recorded in the activity log')}</div></div></div>`;
async function admLogin(){const e=$('#lgErr');try{await login($('#lgPhone').value,$('#lgPw').value,true);if(S.me.role!=='admin'){logout();throw new Error(L('该账号不是管理员','This account is not an admin'))}go('dash');Sync.run('boot')}catch(x){e.textContent=x.message}}

/* ---------- 概览 ---------- */
V.dash=()=>{const today=dayStart();const so=DB.all('so').filter(s=>s.status!=='draft'&&s.status!=='cancel');const tS=so.filter(s=>s.t>=today).reduce((a,s)=>a+docTotal(s),0);
  const mon=+new Date(new Date().getFullYear(),new Date().getMonth(),1);const mS=so.filter(s=>s.t>=mon).reduce((a,s)=>a+docTotal(s),0);
  const val=DB.all('products').reduce((a,p)=>a+qtyOf(p.id)*p.cost,0);const low=DB.all('products').filter(p=>['low','out'].includes(stStatus(p)));
  const tasks=[[L('待出库销售单','Orders to ship'),DB.all('so').filter(s=>s.status==='submitted').length],[L('待入库采购单','POs to receive'),DB.all('po').filter(s=>s.status==='ordered').length],
    [L('待审核盘点','Counts to review'),DB.all('counts').filter(s=>s.status==='pending').length],[L('物流异常','Shipment exceptions'),DB.all('ships').filter(s=>s.status==='exception').length],[L('新物流预约','New bookings'),DB.all('svc').filter(s=>s.status==='new').length]];
  return page(L('概览','Overview'),`<button class="pill w" onclick="Sync.run(true)">${ic('refresh',16)} ${L('刷新','Refresh')}</button>`,`
   <div class="kpis"><div class="stat g"><div class="n" data-notr>${moneyK(tS)}</div><div class="l">${L('今日销售额','Sales today')}</div></div><div class="stat"><div class="n" data-notr>${moneyK(mS)}</div><div class="l">${L('本月销售额','Sales this month')}</div></div>
    <div class="stat"><div class="n" data-notr>${moneyK(val)}</div><div class="l">${L('库存成本','Stock at cost')}</div></div><div class="stat ${low.length?'y':''}"><div class="n">${low.length}</div><div class="l">${L('库存不足商品','Low-stock items')}</div></div>
    <div class="stat"><div class="n">${DB.all('users').filter(u=>u.active!==false).length}</div><div class="l">${L('在用账号','Active users')}</div></div></div>
   <div class="grid" style="margin-top:14px"><div class="box"><h4>${L('待处理','Waiting')}</h4>${tasks.map(t=>`<div class="li" style="cursor:default"><span class="sm b" style="flex:1">${t[0]}</span><b class="${t[1]?'red':''}">${t[1]}</b></div>`).join('')}</div>
    <div class="box"><h4>${L('库存不足','Low stock')}</h4>${low.map(p=>`<div class="li" style="cursor:default"><span class="sm b one" style="flex:1">${esc(nm(p.n))}</span><b class="red" data-notr>${n2(qtyOf(p.id))}</b><span class="xs muted" data-notr>/ ${p.min}</span></div>`).join('')||`<div class="sm muted">${L('全部正常','All good')}</div>`}</div>
    <div class="box"><h4>${L('最近操作','Recent activity')}</h4>${DB.all('moves').sort((a,b)=>b.t-a.t).slice(0,7).map(m=>`<div class="li" style="cursor:default"><span class="badge ${(MV[m.type]||[0,0,'b-grey'])[2]}">${mvName(m.type)}</span><span class="sm one" style="flex:1">${esc(pName(m.pid))}</span><b class="${m.qty<0?'red':'green'}" data-notr>${m.qty>0?'+':''}${n2(m.qty)}</b></div>`).join('')}</div></div>`)};

/* ---------- 商品资料 ---------- */
S.pq='';
V.products=()=>{const q=S.pq.toLowerCase();const l=DB.all('products').filter(p=>!q||[p.n.zh,p.n.en,nm(p.n),p.code,p.bar].join(' ').toLowerCase().includes(q));
  return page(L('商品资料','Products'),`<div class="searchbar" style="margin:0;min-width:240px">${ic('search')}<input placeholder="${L('搜索','Search')}" value="${esc(S.pq)}" oninput="S.pq=this.value;clearTimeout(window._q);window._q=setTimeout(()=>{render(false);const i=document.querySelector('.searchbar input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)"></div><button class="pill g" onclick="prodEdit()">${ic('plus',16)} ${L('新增商品','New product')}</button><button class="pill w" onclick="prodImport()">${ic('upload',16)} ${L('批量导入','Import CSV')}</button>`,
   table(['',L('编码','Code'),L('条码','Barcode'),L('名称','Name'),L('单位','Unit'),L('分类','Category'),L('成本','Cost'),L('售价','Price'),L('安全/上限','Min/Max'),L('库存','Qty'),''],
    l.map(p=>{const q=qtyOf(p.id),s=stStatus(p,q);return `<tr><td>${p.photo?`<img src="${esc(p.photo)}" style="width:36px;height:36px;border-radius:10px;object-fit:cover">`:''}</td><td data-notr>${esc(p.code)}</td><td data-notr>${esc(p.bar)}</td><td class="b">${esc(nm(p.n))}${p.batch?` <span class="badge b-lime">${L('批次','Batch')}</span>`:''}</td><td>${esc(nm(p.unit))}</td><td>${esc(nm(p.cat))}</td><td data-notr>${n2(p.cost)}</td><td data-notr>${n2(p.price)}</td><td data-notr>${p.min} / ${p.max||'—'}</td><td>${n2(q)} ${stBadge(s)}</td><td><button class="pill w" onclick="prodEdit('${p.id}')">${ic('edit',14)}</button></td></tr>`})))};
function prodEdit(id){const p=id?JSON.parse(JSON.stringify(DB.get('products',id))):{n:{zh:'',en:''},unit:{zh:'',en:''},cat:{zh:'',en:''},code:'',bar:'',cost:0,price:0,min:0,max:0,batch:false,sup:''};
  ['n','unit','cat'].forEach(k=>p[k]=biname(p[k]));S.ep=p;
  const f=(k,t,sub,type)=>`<div class="fld" style="flex:1;margin-top:10px"><label>${t}</label><input class="inp" style="background:#fff" ${type?`type="${type}"`:''} value="${esc(sub?p[k][sub]:p[k])}" oninput="S.ep.${k}${sub?'.'+sub:''}=${type==='number'?'+this.value':'this.value'}"></div>`;
  openSheet(`<div class="sh">${id?L('编辑商品','Edit product'):L('新增商品','New product')}</div>
   <div class="row gap" style="margin-top:8px"><div class="photos"><div class="ph" id="epPh" onclick="pickImage(800,u=>{S.ep.photo=u;$('#epPh').innerHTML='<img src=&quot;'+u+'&quot;>'})">${p.photo?`<img src="${esc(p.photo)}">`:ic('image')}</div></div><span class="sm muted">${L('上传商品图片（自动压缩）','Upload a photo (auto-compressed)')}</span></div>
   <div class="row gap">${f('n',L('中文名称','Name (Chinese)'),'zh')}${f('n',L('英文名称','Name (English)'),'en')}</div>
   <div class="row gap">${f('code',L('商品编码','Item code'))}${f('bar',L('条码','Barcode'))}</div>
   <div class="row gap">${f('unit',L('单位（中）','Unit (zh)'),'zh')}${f('unit',L('单位（英）','Unit (en)'),'en')}${f('cat',L('分类（中）','Category (zh)'),'zh')}${f('cat',L('分类（英）','Category (en)'),'en')}</div>
   <div class="row gap">${f('cost',L('成本价','Cost'),'','number')}${f('price',L('售价','Price'),'','number')}${f('min',L('安全库存','Min'),'','number')}${f('max',L('库存上限','Max'),'','number')}</div>
   <div class="fld"><label>${L('默认供应商','Default supplier')}</label><select class="inp" style="background:#fff" onchange="S.ep.sup=this.value"><option value="">—</option>${DB.all('partners').filter(x=>x.type==='sup').map(x=>`<option value="${x.id}" ${x.id===p.sup?'selected':''}>${esc(nm(x.n))}</option>`).join('')}</select></div>
   <label class="row gap" style="margin-top:12px"><input type="checkbox" ${p.batch?'checked':''} onchange="S.ep.batch=this.checked" style="width:20px;height:20px;accent-color:#0B7A4B"><span class="sm b">${L('按批次 / 效期管理','Track batches / expiry')}</span></label>
   <div class="row gap" style="margin-top:18px">${id?`<button class="bigbtn ghost" style="color:var(--red)" onclick="if(confirm(L('删除后历史流水保留，确定删除？','History is kept. Delete this product?'))){DB.put('products',{...DB.get('products','${id}'),del:true});closeSheet();render(false)}">${L('删除','Delete')}</button>`:''}<button class="bigbtn" onclick="prodSave()">${L('保存','Save')}</button></div>`)}
function prodSave(){const p=S.ep;if(!p.n.zh&&!p.n.en)return toast(L('请填写名称','Enter a name'));if(!p.code)return toast(L('请填写商品编码','Enter an item code'));
  if(DB.all('products').some(x=>x.id!==p.id&&(x.code===p.code||(p.bar&&x.bar===p.bar))))return toast(L('编码或条码重复','Code or barcode already used'));
  if(!p.n.zh)p.n.zh=p.n.en;if(!p.n.en)p.n.en=p.n.zh;if(!p.unit.en)p.unit.en=p.unit.zh;if(!p.cat.en)p.cat.en=p.cat.zh;DB.put('products',p);closeSheet();toast(L('已保存','Saved'));render(false)}
/* 批量导入（上传 CSV）：编码,条码,中文名,英文名,单位,成本,售价,安全库存,上限 */
function prodImport(){openSheet(`<div class="sh">${L('批量导入商品','Import products')}</div><div class="sm muted" style="margin-top:6px;line-height:1.7">${L('上传 CSV 文件，列顺序：','Upload a CSV with columns: ')}<b data-notr>code, barcode, name_zh, name_en, unit, cost, price, min, max</b>${L('。编码相同的商品会被更新。','. Existing codes are updated.')}</div>
  <button class="bigbtn" style="width:100%;margin-top:16px" onclick="upCSV()">${ic('upload',18)} ${L('选择 CSV 文件','Choose CSV file')}</button>
  <button class="bigbtn ghost" style="width:100%;margin-top:10px" onclick="downloadFile('products_template.csv','code,barcode,name_zh,name_en,unit,cost,price,min,max\\nHX-2001,6920000000000,示例商品,Sample item,pc,10,15,20,200','text/csv')">${ic('download',18)} ${L('下载模板','Download template')}</button>`)}
function upCSV(){const i=document.createElement('input');i.type='file';i.accept='.csv,text/csv';i.onchange=async()=>{const f=i.files[0];if(!f)return;const t=(await f.text()).replace(/^﻿/,'');
  const rows=t.split(/\r?\n/).map(l=>l.split(',').map(x=>x.trim().replace(/^"|"$/g,''))).filter(r=>r[0]&&r[0]!=='code');let n=0;
  rows.forEach(r=>{const ex=DB.all('products').find(p=>p.code===r[0]);DB.put('products',{...(ex||{batch:false,cat:{zh:'',en:''}}),code:r[0],bar:r[1]||'',n:{zh:r[2]||r[3],en:r[3]||r[2]},unit:{zh:r[4]||'',en:r[4]||''},cost:+r[5]||0,price:+r[6]||0,min:+r[7]||0,max:+r[8]||0},{quiet:n<rows.length-1});n++});
  closeSheet();toast(L(`已导入 ${n} 个商品`,`${n} products imported`));render(false)};i.click()}

/* ---------- 库存总览（分仓） ---------- */
V.stock=()=>{const ws=DB.all('wh');return page(L('库存总览','Stock overview'),`<button class="pill w" onclick="exportStock()">${ic('download',16)} ${L('导出 CSV','Export CSV')}</button>`,
  table([L('商品','Item'),...ws.map(w=>esc(nm(w.n))),L('合计','Total'),L('状态','Status'),L('库存成本','Value at cost'),L('近效期批次','Nearest expiry')],DB.all('products').map(p=>{const q=qtyOf(p.id);const b=batchesOf(p.id).filter(x=>x.q>0&&x.exp)[0];
   return `<tr><td class="b">${esc(nm(p.n))}</td>${ws.map(w=>`<td data-notr>${n2(qtyOf(p.id,w.id))}</td>`).join('')}<td class="b" data-notr>${n2(q)}</td><td>${stBadge(stStatus(p,q))}</td><td data-notr>${money(q*p.cost)}</td><td data-notr>${b?esc(b.exp)+' · '+n2(b.q):'—'}</td></tr>`})))};
function exportStock(){const ws=DB.all('wh');downloadFile(`stock_${fday(Date.now())}.csv`,csv([['code','item',...ws.map(w=>nm(w.n)),'total','cost','value']].concat(DB.all('products').map(p=>[p.code,nm(p.n),...ws.map(w=>qtyOf(p.id,w.id)),qtyOf(p.id),p.cost,qtyOf(p.id)*p.cost]))))}

/* ---------- 用户与角色 ---------- */
V.users=()=>page(L('用户与角色','Users & roles'),`<button class="pill g" onclick="userEdit()">${ic('plus',16)} ${L('新增账号','New user')}</button>`,
  `<div class="grid" style="margin-top:12px">${Object.entries(ROLES).map(([k,r])=>`<div class="box" style="margin:0"><span class="badge ${r.c}">${nm(r)}</span><div class="xs muted" style="margin-top:8px;line-height:1.7">${{admin:L('全部功能，审核盘点，管理账号','Everything, count approval, user management'),buyer:L('采购下单、采购退货、看成本','Purchase orders, supplier returns, sees cost'),sales:L('销售开单、销售退货','Sales orders, customer returns'),keeper:L('采购入库、销售出库、盘点、退货出入库','Receiving, shipping, counts, return handling'),viewer:L('只能查看库存与报表','View stock and reports only')}[k]}</div></div>`).join('')}</div>`+
  table([L('姓名','Name'),L('手机号','Phone'),L('角色','Role'),L('默认仓库','Warehouse'),L('状态','Status'),''],DB.all('users').map(u=>`<tr><td class="b">${esc(nm(u.name))}</td><td data-notr>${esc(u.phone)}</td><td><span class="badge ${ROLES[u.role].c}">${roleName(u.role)}</span></td><td>${esc(whName(u.wh))}</td><td>${u.active===false?`<span class="badge b-grey">${L('已停用','Disabled')}</span>`:`<span class="badge b-green">${L('在用','Active')}</span>`}</td><td><button class="pill w" onclick="userEdit('${u.id}')">${ic('edit',14)}</button></td></tr>`)));
function userEdit(id){const u=id?{...DB.get('users',id)}:{name:'',phone:'',role:'sales',wh:'W1',active:true};S.eu=u;
  openSheet(`<div class="sh">${id?L('编辑账号','Edit user'):L('新增账号','New user')}</div>
   <div class="row gap"><div class="fld" style="flex:1"><label>${L('姓名','Name')}</label><input class="inp" style="background:#fff" value="${esc(nm(u.name))}" oninput="S.eu.name=this.value"></div><div class="fld" style="flex:1"><label>${L('手机号（登录账号）','Phone (login)')}</label><input class="inp" style="background:#fff" value="${esc(u.phone)}" ${id?'disabled':''} oninput="S.eu.phone=this.value.replace(/\\s/g,'')"></div></div>
   <div class="fld"><label>${L('角色','Role')}</label><div class="chips wrap">${Object.keys(ROLES).map(k=>`<span class="chip ${u.role===k?'on':''}" onclick="S.eu.role='${k}';this.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));this.classList.add('on')">${roleName(k)}</span>`).join('')}</div></div>
   <div class="fld"><label>${L('默认仓库','Default warehouse')}</label><select class="inp" style="background:#fff" onchange="S.eu.wh=this.value">${DB.all('wh').map(w=>`<option value="${w.id}" ${w.id===u.wh?'selected':''}>${esc(nm(w.n))}</option>`).join('')}</select></div>
   <div class="fld"><label>${id?L('重置密码（留空不改）','Reset password (leave empty to keep)'):L('初始密码（至少 6 位）','Initial password (min 6)')}</label><input class="inp" style="background:#fff" id="euPw" type="text" autocomplete="new-password"></div>
   <label class="row gap" style="margin-top:12px"><input type="checkbox" ${u.active!==false?'checked':''} onchange="S.eu.active=this.checked" style="width:20px;height:20px;accent-color:#0B7A4B"><span class="sm b">${L('启用此账号','Account enabled')}</span></label>
   <div class="sm red" id="euE" style="margin-top:8px"></div><button class="bigbtn" style="width:100%;margin-top:12px" onclick="userSave()">${L('保存','Save')}</button>`)}
async function userSave(){const u=S.eu,pw=$('#euPw').value,e=$('#euE');if(!nm(u.name))return e.textContent=L('请填写姓名','Enter a name');if(!/^\+?\d{6,15}$/.test(u.phone))return e.textContent=L('手机号格式不正确','Invalid phone number');
  if(!u.id&&pw.length<6)return e.textContent=L('初始密码至少 6 位','Password: at least 6 characters');if(pw&&pw.length<6)return e.textContent=L('密码至少 6 位','Password: at least 6 characters');
  if(!u.id&&DB.all('users').some(x=>x.phone===u.phone))return e.textContent=L('该手机号已存在','This phone already exists');
  try{if(DB.cloud){const r=await rpc('jxc_admin_user',{p_token:S.token,p_user:{id:u.id||null,name:u.name,phone:u.phone,role:u.role,wh:u.wh,active:u.active!==false},p_pw:pw||null});if(r&&r.users)DB.d.users=r.users}
    else{const d={...u};if(pw)d.pw=await pwHash(u.phone,pw);DB.put('users',d)}closeSheet();toast(L('已保存','Saved'));render(false)}catch(x){e.textContent=x.message}}

/* ---------- 往来单位 / 仓库 ---------- */
V.partners=()=>page(L('往来单位','Partners'),`<button class="pill g" onclick="ptEdit()">${ic('plus',16)} ${L('新增','New')}</button>`,table([L('类型','Type'),L('名称','Name'),L('电话','Phone'),L('城市','City'),''],DB.all('partners').map(p=>`<tr><td><span class="badge ${p.type==='sup'?'b-blue':'b-gold'}">${p.type==='sup'?L('供应商','Supplier'):L('客户','Customer')}</span></td><td class="b">${esc(nm(p.n))}</td><td data-notr>${esc(p.phone||'')}</td><td>${esc(nm(p.city))}</td><td><button class="pill w" onclick="ptEdit('${p.id}')">${ic('edit',14)}</button></td></tr>`)));
function ptEdit(id){const p=id?JSON.parse(JSON.stringify(DB.get('partners',id))):{type:'cus',n:{zh:'',en:''},phone:'',city:{zh:'',en:''}};p.n=biname(p.n);p.city=biname(p.city);S.ept=p;
  openSheet(`<div class="sh">${L('往来单位','Partner')}</div><div class="seg">${[['cus',L('客户','Customer')],['sup',L('供应商','Supplier')]].map(([k,t])=>`<button class="${p.type===k?'on':''}" onclick="S.ept.type='${k}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${t}</button>`).join('')}</div>
   <div class="row gap"><div class="fld" style="flex:1"><label>${L('中文名称','Name (Chinese)')}</label><input class="inp" style="background:#fff" value="${esc(p.n.zh)}" oninput="S.ept.n.zh=this.value"></div><div class="fld" style="flex:1"><label>${L('英文名称','Name (English)')}</label><input class="inp" style="background:#fff" value="${esc(p.n.en)}" oninput="S.ept.n.en=this.value"></div></div>
   <div class="row gap"><div class="fld" style="flex:1"><label>${L('电话','Phone')}</label><input class="inp" style="background:#fff" value="${esc(p.phone)}" oninput="S.ept.phone=this.value"></div><div class="fld" style="flex:1"><label>${L('城市','City')}</label><input class="inp" style="background:#fff" value="${esc(nm(p.city))}" oninput="S.ept.city={zh:this.value,en:this.value}"></div></div>
   <button class="bigbtn" style="width:100%;margin-top:16px" onclick="const p=S.ept;if(!p.n.zh&&!p.n.en)return toast(L('请填写名称','Enter a name'));p.n.zh=p.n.zh||p.n.en;p.n.en=p.n.en||p.n.zh;DB.put('partners',p);closeSheet();render(false)">${L('保存','Save')}</button>`)}
V.wh=()=>page(L('仓库','Warehouses'),`<button class="pill g" onclick="whEdit()">${ic('plus',16)} ${L('新增仓库','New warehouse')}</button>`,table([L('编号','ID'),L('名称','Name'),L('城市','City'),L('商品种数','SKUs'),L('库存成本','Value'),''],DB.all('wh').map(w=>{const ps=DB.all('products').filter(p=>qtyOf(p.id,w.id)>0);
  return `<tr><td data-notr>${esc(w.id)}</td><td class="b">${esc(nm(w.n))}</td><td>${esc(nm(w.city))}</td><td>${ps.length}</td><td data-notr>${money(ps.reduce((a,p)=>a+qtyOf(p.id,w.id)*p.cost,0))}</td><td><button class="pill w" onclick="whEdit('${w.id}')">${ic('edit',14)}</button></td></tr>`})));
function whEdit(id){const w=id?JSON.parse(JSON.stringify(DB.get('wh',id))):{id:'W'+(DB.all('wh').length+1),n:{zh:'',en:''},city:{zh:'',en:''}};w.n=biname(w.n);w.city=biname(w.city);S.ew=w;
  openSheet(`<div class="sh">${L('仓库','Warehouse')}</div><div class="row gap"><div class="fld" style="flex:1"><label>${L('中文名称','Name (Chinese)')}</label><input class="inp" style="background:#fff" value="${esc(w.n.zh)}" oninput="S.ew.n.zh=this.value"></div><div class="fld" style="flex:1"><label>${L('英文名称','Name (English)')}</label><input class="inp" style="background:#fff" value="${esc(w.n.en)}" oninput="S.ew.n.en=this.value"></div></div>
  <div class="row gap"><div class="fld" style="flex:1"><label>${L('城市（中）','City (zh)')}</label><input class="inp" style="background:#fff" value="${esc(w.city.zh)}" oninput="S.ew.city.zh=this.value"></div><div class="fld" style="flex:1"><label>${L('城市（英）','City (en)')}</label><input class="inp" style="background:#fff" value="${esc(w.city.en)}" oninput="S.ew.city.en=this.value"></div></div>
  <button class="bigbtn" style="width:100%;margin-top:16px" onclick="const w=S.ew;if(!w.n.zh&&!w.n.en)return toast(L('请填写名称','Enter a name'));w.n.zh=w.n.zh||w.n.en;w.n.en=w.n.en||w.n.zh;DB.put('wh',w);closeSheet();render(false)">${L('保存','Save')}</button>`)}

/* ---------- 盘点审核 ---------- */
V.counts=()=>page(L('盘点审核','Count reviews'),'',DB.all('counts').sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||b.t-a.t).map(d=>{const df=d.items.filter(i=>i.real!==i.sys);const val=df.reduce((a,i)=>a+(i.real-i.sys)*((DB.get('products',i.pid)||{}).cost||0),0);
  return `<div class="box"><div class="row between" style="flex-wrap:wrap;gap:8px"><div><b data-notr>${esc(d.no)}</b> ${stB(TK_ST,d.status)}<div class="xs muted" style="margin-top:4px">${esc(whName(d.wh))} · ${esc(userName(d.by))} · ${fdate(d.t)}</div></div>
   <div class="row gap"><span class="sm">${L('差异','Diffs')} <b class="${df.length?'red':''}">${df.length}</b> · <b class="${val<0?'red':'green'}" data-notr>${money(val)}</b></span>${d.status==='pending'?`<button class="pill w" onclick="tkDo('${d.id}',false)">${L('驳回','Reject')}</button><button class="pill g" onclick="tkDo('${d.id}',true)">${L('审核通过','Approve')}</button>`:''}</div></div>
   ${table([L('商品','Item'),L('账面','Book'),L('实盘','Counted'),L('差异','Diff')],d.items.map(i=>{const x=i.real-i.sys;return `<tr><td>${esc(pName(i.pid))}</td><td data-notr>${n2(i.sys)}</td><td data-notr>${n2(i.real)}</td><td class="b ${x>0?'green':x<0?'red':''}" data-notr>${x>0?'+':''}${n2(x)}</td></tr>`}))}</div>`}).join('')||emptyBox('clip',L('暂无盘点单','No counts')));
function emptyBox(icon,txt){return `<div class="empty">${ic(icon)}<div>${txt}</div></div>`}
function tkDo(id,ok){const d=DB.get('counts',id);if(ok){d.items.forEach(i=>{const x=i.real-i.sys;if(!x)return;const p=DB.get('products',i.pid)||{};let batch='';if(p.batch){const b=batchesOf(i.pid,d.wh).filter(b=>b.q>0);batch=x<0?(b[0]||{}).batch||'':(b[b.length-1]||{}).batch||''}addMove({pid:i.pid,wh:d.wh,qty:x,type:'adj',ref:d.id,batch})});DB.put('counts',{...d,status:'approved',rv:S.me.id,rt:Date.now()})}
  else{const r=prompt(L('驳回原因','Reason for rejection'))||'';DB.put('counts',{...d,status:'rejected',rv:S.me.id,rt:Date.now(),rr:r})}toast(L('已处理','Done'));render(false)}

/* ---------- 物流与预约 ---------- */
V.ships=()=>{const BK={new:['待处理','New','b-gold'],confirmed:['已安排','Scheduled','b-blue'],done:['已完成','Done','b-green'],cancel:['已取消','Cancelled','b-grey']};
  return page(L('物流与预约','Logistics'),'',`<div class="sec-h">${L('物流预约','Bookings')}</div>`+table([L('单号','No.'),L('类型','Type'),L('路线','Route'),L('日期','Date'),L('重量','Weight'),L('说明','Details'),L('申请人','By'),L('状态','Status'),''],
   DB.all('svc').sort((a,b)=>b.t-a.t).map(b=>`<tr><td data-notr>${esc(b.no)}</td><td>${{pickup:L('上门提货','Pickup'),delivery:L('送货上门','Delivery'),customs:L('代理报关','Customs')}[b.type]}</td><td>${esc(nm(b.from))} → ${esc(nm(b.to))}</td><td data-notr>${esc(b.date)}</td><td data-notr>${n2(b.weight||0)} kg</td><td>${esc(nm(b.note)||'')}</td><td>${esc(userName(b.by))}</td><td><span class="badge ${BK[b.status][2]}">${L(BK[b.status][0],BK[b.status][1])}</span></td>
    <td style="white-space:nowrap">${b.status==='new'?`<button class="pill g" onclick="DB.put('svc',{...DB.get('svc','${b.id}'),status:'confirmed'});render(false)">${L('安排','Schedule')}</button>`:b.status==='confirmed'?`<button class="pill w" onclick="DB.put('svc',{...DB.get('svc','${b.id}'),status:'done'});render(false)">${L('完成','Done')}</button>`:''}</td></tr>`))
   +`<div class="sec-h">${L('全部物流','All shipments')}</div>`+table([L('单号','No.'),L('方向','Dir.'),L('承运商','Carrier'),L('运单号','Tracking'),L('路线','Route'),L('预计到达','ETA'),L('运费','Cost'),L('状态','Status')],
   DB.all('ships').sort((a,b)=>b.u-a.u).map(s=>`<tr><td data-notr>${esc(s.no)}</td><td>${s.dir==='in'?L('到货','In'):L('发货','Out')}</td><td>${esc(nm(carrier(s.carrier)))}</td><td data-notr>${trackUrl(s)?`<a href="${esc(trackUrl(s))}" target="_blank" class="green b">${esc(s.trackNo)}</a>`:esc(s.trackNo||'')}</td><td>${esc(nm(s.from))} → ${esc(nm(s.to))}</td><td data-notr>${esc(s.eta||'')}</td><td data-notr>${n2(s.cost||0)}</td><td>${stB(SH_ST,s.status)}</td></tr>`))
   +`<div class="sec-h">${L('运费估算参数','Freight estimate rates')}</div><div class="box" style="margin-top:0">${Object.keys(MODES).map(k=>{const r=((DB.get('settings','app')||{}).rates||{})[k]||[1,1,3];return `<div class="row gap" style="margin-top:8px"><b style="width:70px">${L(MODES[k][0],MODES[k][1])}</b><span class="xs muted">${CUR()}/kg</span><input class="inp" style="width:90px;background:#F7F5F0;padding:8px" type="number" value="${r[0]}" onchange="setRate('${k}',0,this.value)"><span class="xs muted">${L('时效','Days')}</span><input class="inp" style="width:70px;background:#F7F5F0;padding:8px" type="number" value="${r[1]}" onchange="setRate('${k}',1,this.value)"><span>–</span><input class="inp" style="width:70px;background:#F7F5F0;padding:8px" type="number" value="${r[2]}" onchange="setRate('${k}',2,this.value)"></div>`}).join('')}</div>`)};
function setRate(k,i,v){const s=JSON.parse(JSON.stringify(DB.get('settings','app')||{id:'app'}));s.rates=s.rates||{};s.rates[k]=s.rates[k]||[1,1,3];s.rates[k][i]=+v;DB.put('settings',s);toast(L('已保存','Saved'))}

/* ---------- 操作日志 ---------- */
S.lgK='all';
V.log=()=>{const K={so:L('销售单','Sales order'),po:L('采购单','PO'),grn:L('入库单','Receipt'),pr:L('采购退货','Supplier return'),sr:L('销售退货','Customer return'),counts:L('盘点单','Count'),ships:L('物流','Shipment'),products:L('商品','Product'),users:L('账号','User'),partners:L('往来单位','Partner'),svc:L('物流预约','Booking'),moves:L('库存流水','Movement')};
  let rows=[];Object.keys(K).forEach(k=>{if(S.lgK!=='all'&&S.lgK!==k)return;(DB.d[k]||[]).forEach(d=>rows.push({k,d}))});rows=rows.sort((a,b)=>(b.d.u||0)-(a.d.u||0)).slice(0,200);
  return page(L('操作日志','Activity log'),'',`<div class="chips">${[['all',L('全部','All')]].concat(Object.entries(K)).map(([k,t])=>`<span class="chip sm ${S.lgK===k?'on':''}" onclick="S.lgK='${k}';render(false)">${t}</span>`).join('')}</div>`+
   table([L('时间','Time'),L('类型','Type'),L('单号 / 内容','Ref'),L('操作人','By'),L('状态','State')],rows.map(({k,d})=>`<tr><td data-notr>${fday(d.u)} ${new Date(d.u).toTimeString().slice(0,5)}</td><td>${K[k]}</td><td data-notr>${esc(d.no||(k==='moves'?pName(d.pid)+' '+(d.qty>0?'+':'')+n2(d.qty):nm(d.n||d.name)||d.id))}</td><td>${esc(userName(d.by))}</td><td>${d.del?`<span class="badge b-grey">${L('已删除','Deleted')}</span>`:d.status?esc(d.status):k==='moves'?mvName(d.type):''}</td></tr>`)))};

/* ---------- 系统设置 ---------- */
V.settings=()=>{const s=DB.get('settings','app')||{id:'app',cur:'GH₵',co:{zh:'',en:''}};
  return page(L('系统设置','Settings'),'',`<div class="box"><h4>${L('公司与货币','Company & currency')}</h4><div class="row gap" style="flex-wrap:wrap">
   <div class="fld" style="flex:1;min-width:200px"><label>${L('公司名称（中）','Company (zh)')}</label><input class="inp" style="background:#F7F5F0" value="${esc((s.co||{}).zh||'')}" id="stCz"></div>
   <div class="fld" style="flex:1;min-width:200px"><label>${L('公司名称（英）','Company (en)')}</label><input class="inp" style="background:#F7F5F0" value="${esc((s.co||{}).en||'')}" id="stCe"></div>
   <div class="fld" style="width:140px"><label>${L('货币符号','Currency')}</label><input class="inp" style="background:#F7F5F0" value="${esc(s.cur||'GH₵')}" id="stCur"></div></div>
   <button class="bigbtn" style="margin-top:14px;max-width:220px" onclick="DB.put('settings',{...(DB.get('settings','app')||{id:'app'}),cur:$('#stCur').value||'GH₵',co:{zh:$('#stCz').value,en:$('#stCe').value}});toast(L('已保存','Saved'));render(false)">${L('保存','Save')}</button></div>
   <div class="box"><h4>${L('云端连接','Cloud connection')}</h4><div class="sm" style="line-height:1.8">${DB.cloud?`${L('已连接','Connected')}: <b data-notr>${esc(CFG.supabaseUrl)}</b>`:L('未连接（本机演示模式）。在 www/config.js 中填写 Supabase 地址和公开密钥，并在数据库执行 04_数据库脚本/schema.sql 后即可多人实时使用。','Not connected (local demo). Fill in the Supabase URL and anon key in www/config.js, and run the database script schema.sql in Supabase to go multi-user.')}</div></div>`)};

/* ---------- 数据备份：下载 / 上传恢复 ---------- */
V.backup=()=>page(L('数据备份','Backup'),'',`<div class="grid" style="margin-top:12px">
  <div class="box" style="margin:0"><h4>${ic('download')} ${L('下载备份','Download backup')}</h4><div class="sm muted" style="line-height:1.7">${L('把全部商品、库存流水、单据、物流导出为一个 JSON 文件（不含密码）。','Exports all products, movements, orders and shipments as one JSON file (no passwords).')}</div><button class="bigbtn" style="margin-top:14px;width:100%" onclick="bkDown()">${L('下载 JSON','Download JSON')}</button></div>
  <div class="box" style="margin:0"><h4>${ic('upload')} ${L('上传恢复','Restore from file')}</h4><div class="sm muted" style="line-height:1.7">${L('上传之前下载的备份文件，记录按“较新者优先”合并，不会删除现有数据。','Upload a backup file. Records are merged (newer wins); nothing is deleted.')}</div><button class="bigbtn dark" style="margin-top:14px;width:100%" onclick="bkUp()">${L('选择备份文件','Choose backup file')}</button></div>
  <div class="box" style="margin:0"><h4>${ic('star')} ${L('演示数据','Sample data')}</h4><div class="sm muted" style="line-height:1.7">${DB.cloud?L('把演示商品、仓库和往来单位写入云端，方便试用（不会覆盖已有账号）。','Push sample products, warehouses and partners to the cloud for a trial (accounts untouched).'):L('恢复为初始演示数据（本机）。','Restore the initial sample data (this device).')}</div><button class="bigbtn ghost" style="margin-top:14px;width:100%" onclick="bkDemo()">${DB.cloud?L('导入演示数据','Import sample data'):L('重置演示数据','Reset sample data')}</button></div></div>`);
function bkDown(){const o={app:'jxc',ver:APP_VER,at:new Date().toISOString(),data:{}};KINDS.forEach(k=>o.data[k]=(DB.d[k]||[]).map(d=>{const x={...d};delete x.pw;delete x._q;return x}));downloadFile(`jxc_backup_${fday(Date.now())}.json`,JSON.stringify(o),'application/json')}
function bkUp(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text());if(o.app!=='jxc')throw new Error('format');let n=0;
  KINDS.filter(k=>k!=='users').forEach(k=>(o.data[k]||[]).forEach(d=>{const ex=DB.get(k,d.id);if(!ex||(ex.u||0)<(d.u||0)){DB.put(k,{...d},{quiet:true});n++}}));DB.save();bc('reset');Sync.run();toast(L(`已恢复 ${n} 条记录`,`${n} records restored`));render(false)}catch(e){toast(L('文件格式不正确','Invalid backup file'))}};i.click()}
async function bkDemo(){if(!confirm(L('确定？','Are you sure?')))return;if(!DB.cloud){await seedDemo();bc('reset');toast(L('已恢复演示数据','Sample data restored'));render(false);return}
  const keep={...DB.d};await seedDemo();const add=[];['settings','wh','products','partners','moves','po','grn','so','sr','counts','ships','svc'].forEach(k=>DB.d[k].forEach(d=>add.push({k,d})));
  KINDS.forEach(k=>DB.d[k]=keep[k]);add.forEach(r=>DB.put(r.k,r.d,{quiet:true}));Sync.run(true)}

/* ---------- 发布更新（与 ChinaPaw“发布更新清单”一致） ---------- */
V.release=()=>{const steps=[[L('修改代码','Edit code'),L('改 src/ 下的源码后运行 python3 build.py 生成 www/index.html','Edit src/, then run python3 build.py')],[L('升版本号','Bump version'),L('core.js 中 APP_VER 与 APP_BUILD（+1）','APP_VER and APP_BUILD (+1) in core.js')],
  [L('更新 version.json','Update version.json'),L('version、build、date、中英文更新说明','version, build, date, notes in both languages')],[L('自动化测试','Automated tests'),L('python3 tests/t1.py 与 t2.py：无报错、中英文纯净','tests/t1.py and t2.py: no errors, clean languages')],
  [L('提交到 GitHub main','Commit to GitHub main'),L('Cloudflare Pages 1–3 分钟自动上线；PWA 由 Actions 自动发布','Cloudflare Pages deploys in 1–3 min; PWA via Actions')],[L('线上验证','Verify online'),L('打开网址带 ?v=新编号，确认 build','Open the site with ?v=new build and confirm')],
  [L('需要改原生能力时','Native changes only'),L('改 capacitor 配置 → Actions 自动打包 APK → 提高 version.json 的 minNative','Change Capacitor config → Actions builds APK → raise minNative')]];
  return page(L('发布更新','Release'),'',`<div class="box"><div class="kv"><div><div class="l">${L('当前网页版本','Web version')}</div><div class="v" data-notr>v${APP_VER} · build ${APP_BUILD}</div></div><div><div class="l">${L('线上 version.json','Live version.json')}</div><div class="v" id="rlV">…</div></div></div></div>
   <div class="box"><h4>${L('每次发布的固定步骤','Steps for every release')}</h4>${steps.map((s,i)=>`<label class="li" style="cursor:pointer"><input type="checkbox" style="width:20px;height:20px;accent-color:#0B7A4B"><div style="flex:1"><div class="b sm">${i+1}. ${s[0]}</div><div class="xs muted">${s[1]}</div></div></label>`).join('')}</div>`)};
const _rel=V.release;V.release=()=>{setTimeout(async()=>{try{const v=await (await fetch('../version.json?t='+Date.now(),{cache:'no-store'})).json();const e=$('#rlV');if(e)e.textContent='v'+v.version+' · build '+v.build}catch(x){const e=$('#rlV');if(e)e.textContent=L('读取失败','Unavailable')}},50);return _rel()};

/* ---------- 启动 ---------- */
(async function(){S.lang=LS.get('lang',null)||detectLang();setLang(S.lang);DB.load();if(!DB.cloud&&!LS.get('seeded',0))await seedDemo();
  const s=LS.get(SK,null);if(s&&s.me&&s.me.role==='admin'&&s.trust){S.me=s.me;S.token=s.token;S.view='dash'}else S.view='login';render(true);Sync.start();if(S.me)Sync.run('boot')})();

</script>
